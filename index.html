      <span style={{width:22,height:22,borderRadius:11,background:"var(--monday-purple)",color:"white",
        fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{n}</span>
      <div style={{fontSize:13,color:"var(--gray-500)",lineHeight:1.6,paddingTop:2}}>{children}</div>
    </div>
  );
  const Example=({title,steps})=>(
    <div style={{background:"white",borderRadius:8,border:"1px solid var(--gray-100)",padding:"12px 14px",marginBottom:10}}>
      <div style={{fontSize:13,fontWeight:700,color:"var(--gray-700)",marginBottom:8}}>{title}</div>
      {steps.map((s,i)=>(
        <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:6}}>
          <span style={{fontSize:11,fontWeight:700,color:"white",background:["#6161ff","#00c875","#ff9900","#00d3d0"][i%4],
            borderRadius:4,padding:"1px 6px",flexShrink:0,marginTop:1}}>{["Trigger","Condition","Action","Formula"][i%4]}</span>
          <span style={{fontSize:13,color:"var(--gray-500)"}}>{s}</span>
        </div>
      ))}
    </div>
  );

  const content={
    overview:(
      <>
        <H>What is the Automation Builder?</H>
        <P>The Automation Builder lets you create powerful, multi-step automations on monday.com that go far beyond what monday's native automation center supports. Connect triggers, conditions, actions, and formulas in a visual flow — then deploy them to run live on your boards.</P>
        <Box color="#6161ff" light="#ebebff" icon="⬡" title="How it works">
          Build your automation on the canvas by connecting nodes. Each node is a step in the workflow. When a trigger fires in monday.com, the automation runs every node in sequence — checking conditions, executing actions, and calculating formulas.
        </Box>
        <H>Quick start</H>
        <Step n="1">Connect your monday.com account in <strong>⚙ Settings</strong></Step>
        <Step n="2">Add a <strong>Trigger</strong> node — this is what starts your automation</Step>
        <Step n="3">Add <strong>Action</strong> or <strong>Formula</strong> nodes — these are what your automation does</Step>
        <Step n="4">Click <strong>Save</strong> then <strong>↑ Deploy + Activate</strong></Step>
        <Step n="5">Test it by triggering the event in monday.com — the automation runs automatically</Step>
      </>
    ),
    triggers:(
      <>
        <H>Trigger nodes</H>
        <P>Triggers start your automation. Every automation must have at least one trigger.</P>
        <Box color="#6161ff" light="#ebebff" icon="⚡" title="Status changes">
          Fires when a status column on any item changes to a specific value.<br/><br/>
          <strong>Configure:</strong> Select the board, the status column, and the value it changes to (e.g. "Done", "Won", "Approved").
        </Box>
        <Box color="#6161ff" light="#ebebff" icon="⚡" title="Item created">
          Fires whenever a new item is added to the selected board. No additional configuration needed.
        </Box>
        <Box color="#6161ff" light="#ebebff" icon="⚡" title="Column value changes">
          Fires whenever a specific column changes to any value. Useful for tracking updates to any field, not just status columns.
        </Box>
        <Box color="#6161ff" light="#ebebff" icon="⚡" title="Date reached">
          Fires on the date stored in a date column. Use the offset field to fire days before or after (e.g. -3 = 3 days before the date).
        </Box>
        <P><strong>Note:</strong> Triggers require a webhook to be registered in monday.com. This happens automatically when you deploy and activate an automation.</P>
      </>
    ),
    conditions:(
      <>
        <H>Condition nodes</H>
        <P>Conditions let you branch your automation based on a value. The automation takes the <strong style={{color:"var(--monday-purple)"}}>Yes</strong> path if the condition is true, or the <strong style={{color:"var(--monday-red)"}}>No</strong> path if false.</P>
        <Box color="#00c875" light="#e6faf3" icon="◆" title="If / Else">
          Checks a column value and routes to two different paths.<br/><br/>
          <strong>Operators:</strong> equals · does not equal · contains · is empty · is not empty<br/><br/>
          <strong>Example:</strong> If Priority equals "High" → Yes path creates an urgent task. No path sends a standard notification.
        </Box>
        <Box color="#00c875" light="#e6faf3" icon="◆" title="Filter / Gate">
          Like If/Else but with only one path. If the condition is false, the automation stops entirely at this point. Use this to prevent unnecessary actions.
        </Box>
        <H>Connecting condition paths</H>
        <P>Drag from the <strong style={{color:"var(--monday-purple)"}}>Y</strong> port on the right side of the node to connect the Yes path. Drag from the <strong style={{color:"var(--monday-red)"}}>N</strong> port to connect the No path. You can connect both, or just one.</P>
      </>
    ),
    actions:(
      <>
        <H>Action nodes</H>
        <P>Actions are what your automation does. You can chain multiple actions together — each one runs after the previous one completes.</P>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="Create group">
          Creates a new group on any board. The group name can include tokens like <Code>{"{{item.name}}"}</Code> to make it dynamic.<br/><br/>
          <strong>Example:</strong> Create a group called "Completed — <Code>{"{{item.name}}"}</Code>" on your archive board.
        </Box>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="Create item">
          Creates a new item on any board in any group. The item name supports tokens.
        </Box>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="Change column">
          Sets a column on the triggering item to a specific value. For status columns, pick from a dropdown. For text/number columns, type any value.
        </Box>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="Move item">
          Moves the triggering item to a different group on any board.
        </Box>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="Notify user">
          Sends a bell notification in monday.com. The message supports tokens.
        </Box>
        <Box color="#ff9900" light="#fff4e0" icon="▶" title="HTTP request">
          Calls any external URL (webhook, API, Zapier, Make, etc.) with a JSON body. Use tokens in the URL and body to pass live data.
        </Box>
      </>
    ),
    formulas:(
      <>
        <H>Formula nodes</H>
        <P>Formula nodes read number or text values from monday.com columns, perform a calculation, and write the result back to another column — automatically, every time the automation runs.</P>
        <Box color="#00d3d0" light="#e0fafa" icon="∑" title="Math formula">
          Adds, subtracts, multiplies, or divides two number columns and writes the result to a third.<br/><br/>
          <strong>Example:</strong> Column A (Revenue) + Column B (Bonus) → Column C (Total)<br/>
          <strong>Operators:</strong> + − × ÷
        </Box>
        <Box color="#00d3d0" light="#e0fafa" icon="∑" title="Percentage">
          Calculates (Column A ÷ Column B) × 100 and writes the result as a percentage.<br/><br/>
          <strong>Example:</strong> Deals Won ÷ Total Deals × 100 → Win Rate %
        </Box>
        <Box color="#00d3d0" light="#e0fafa" icon="∑" title="IF condition">
          Compares a number column against a fixed value and writes different text based on the result.<br/><br/>
          <strong>Example:</strong> If Score {">"} 80 → write "Pass", else write "Fail"
        </Box>
        <Box color="#00d3d0" light="#e0fafa" icon="∑" title="Combine text">
          Joins multiple column values into one text field with a separator.<br/><br/>
          <strong>Example:</strong> First Name + " " + Last Name → Full Name
        </Box>
        <H>Chaining formulas</H>
        <P>You can chain multiple formula nodes together to build complex calculations. Each formula writes its result to a column, and subsequent formulas can read that column as an input.</P>
        <P><strong>Example chain:</strong> Revenue + Bonus = Total → Expenses + Tax = Costs → Total × Costs = Profit</P>
        <P><strong>Note:</strong> Formula nodes require the Netlify runner to execute — they read live column values at the moment the automation fires. The test run panel will show them as skipped; deploy and activate to run them live.</P>
      </>
    ),
    tokens:(
      <>
        <H>Tokens</H>
        <P>Tokens are placeholders that get replaced with live values when your automation runs. Use them in group names, item names, notification messages, and HTTP request bodies.</P>
        <div style={{background:"white",borderRadius:8,border:"1px solid var(--gray-100)",overflow:"hidden",marginBottom:12}}>
          {[
            ["{{item.name}}","The name of the item that triggered the automation","My Project"],
            ["{{item.status}}","The new status value that triggered the automation","Done"],
            ["{{item.owner}}","The user ID of the item's assignee","12345"],
            ["{{item.id}}","The monday.com item ID (needed for Change Column)","9876543"],
            ["{{today}}","Today's date in YYYY-MM-DD format","2026-05-15"],
            ["{{ai.output}}","The response from an AI step node (if used)","Summary text…"],
            ["{{loop.index}}","Current iteration number inside a loop node","1, 2, 3…"],
          ].map(([token,desc,example],i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,padding:"10px 14px",
              borderBottom:i<6?"1px solid var(--gray-100)":"none",alignItems:"center"}}>
              <div>
                <Code>{token}</Code>
                <div style={{fontSize:12,color:"var(--gray-300)",marginTop:4}}>{desc}</div>
              </div>
              <div style={{fontSize:12,color:"var(--monday-green)",fontFamily:"monospace",fontWeight:500}}>→ {example}</div>
            </div>
          ))}
        </div>
        <H>Using tokens</H>
        <P>Click the token pills in the config panel to insert them, or type them manually. They work in: group names, item names, notification messages, HTTP request URL and body.</P>
        <P><strong>Example:</strong> Group name <Code>Completed — {"{{item.name}}"}</Code> becomes <Code>Completed — My Project</Code> when the automation runs.</P>
      </>
    ),
    deploy:(
      <>
        <H>Deploying your automation</H>
        <P>Building an automation in the canvas is just the first step. To make it run live in monday.com, you need to deploy it.</P>
        <H>↑ Deploy vs ↑ Deploy + Activate</H>
        <Box color="#0073ea" light="#e6f2ff" icon="↑" title="Deploy">
          Saves your automation to the server but does not start it. Use this when you want to review before going live.
        </Box>
        <Box color="#00c875" light="#e6faf3" icon="↑" title="Deploy + Activate">
          Saves your automation and immediately activates it. monday.com will start sending webhook events to your runner, and the automation will execute on every matching trigger.
        </Box>
        <H>What happens when you deploy</H>
        <Step n="1">Your automation JSON is sent to the Netlify function and stored in Supabase</Step>
        <Step n="2">The function registers a webhook with monday.com for each trigger node</Step>
        <Step n="3">monday.com sends a POST to your Netlify URL whenever the trigger condition fires</Step>
        <Step n="4">The function finds your automation, runs the graph, and executes all actions</Step>
        <H>Updating a deployed automation</H>
        <P>Make your changes on the canvas, then click <strong>↑ Deploy + Activate</strong> again. The existing automation in Supabase is overwritten with the new version.</P>
        <H>Disabling an automation</H>
        <P>Toggle the <strong>Active/Draft</strong> switch in the top bar to Draft, then redeploy. The runner will skip inactive automations even if the trigger fires.</P>
      </>
    ),
    examples:(
      <>
        <H>Example automations</H>
        <P>Here are some ready-to-build automations to get you started.</P>
        <Example title="Sales deal won → Create archive group"
          steps={["Status changes to 'Won' on Sales Pipeline board","Create group 'Closed — {{item.name}}' on Archive board"]}/>
        <Example title="New item → Notify team + assign priority"
          steps={["Item created on Project board","Change column: Priority → High","Notify user: Item assignee — '{{item.name}} needs your attention'"]}/>
        <Example title="High value deal routing"
          steps={["Status changes to 'Proposal' on CRM board","If Deal Value > 50000 → Yes path","Create item on Enterprise Deals board with name '{{item.name}}'"]}/>
        <Example title="Calculate win rate on close"
          steps={["Status changes to 'Won' or 'Lost'","Math formula: Won Deals + 1 → Won Deals (increment)","Percentage: Won Deals ÷ Total Deals × 100 → Win Rate %"]}/>
        <Example title="Auto-generate client summary"
          steps={["Status changes to 'Complete'","Combine text: Client Name + ' — ' + Project Name → Project Summary column","HTTP request: POST to Slack webhook with body {\"text\": \"{{item.name}} completed\"}"]}/>
        <H>Tips</H>
        <P>• <strong>Chain formula nodes</strong> for multi-step calculations — each result writes to a column the next formula can read.</P>
        <P>• <strong>Use Filter nodes</strong> early in your flow to stop the automation before unnecessary actions run.</P>
        <P>• <strong>Test before deploying</strong> — use the ▶ Test panel to verify your action nodes work correctly against real data.</P>
        <P>• <strong>One automation per trigger</strong> is fine — but you can also build one complex automation with conditions that branch into many different outcomes.</P>
      </>
    ),
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--gray-700)",marginBottom:2}}>Documentation</div>
        <div style={{fontSize:13,color:"var(--gray-300)"}}>Everything you need to build automations</div>
      </div>
      {/* Section nav */}
      <div style={{display:"flex",gap:4,padding:"8px 12px",borderBottom:"1px solid var(--gray-100)",flexWrap:"wrap",flexShrink:0}}>
        {sections.map(s=>(
          <button key={s.key} onClick={()=>setSection(s.key)}
            style={{padding:"4px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,
              background:section===s.key?"var(--monday-purple)":"var(--gray-50)",
              color:section===s.key?"white":"var(--gray-500)",transition:"all 0.15s"}}>
            {s.label}
          </button>
        ))}
      </div>
      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"4px 20px 20px"}}>
        {content[section]}
      </div>
    </div>
  );
}

function WorkspaceTree({workspaces}) {
  const [openWs,setOpenWs]=useState({});
  const [openBoards,setOpenBoards]=useState({});
  const toggleWs=id=>setOpenWs(o=>({...o,[id]:!o[id]}));
  const toggleBoard=id=>setOpenBoards(o=>({...o,[id]:!o[id]}));
  useEffect(()=>{ if(workspaces.length>0&&Object.keys(openWs).length===0) setOpenWs({[workspaces[0].id]:true}); },[workspaces]);

  return(
    <div style={{background:"white",borderRadius:10,border:"1px solid var(--gray-100)",overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid var(--gray-100)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,fontWeight:700,color:"var(--gray-700)"}}>Connected boards</span>
        <span className="badge" style={{background:"var(--monday-purple-light)",color:"var(--monday-purple)"}}>
          {workspaces.reduce((t,w)=>t+w.boards.length,0)} boards
        </span>
      </div>
      {workspaces.map(ws=>(
        <div key={ws.id} style={{borderBottom:"1px solid var(--gray-100)"}}>

          {/* Workspace row */}
          <div onClick={()=>toggleWs(ws.id)}
            style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer",
              background:openWs[ws.id]?"var(--monday-purple-light)":"white",transition:"background 0.1s"}}
            onMouseEnter={e=>{if(!openWs[ws.id])e.currentTarget.style.background="var(--gray-50)";}}
            onMouseLeave={e=>{e.currentTarget.style.background=openWs[ws.id]?"var(--monday-purple-light)":"white";}}>
            <span style={{fontSize:11,color:openWs[ws.id]?"var(--monday-purple)":"var(--gray-300)",
              display:"inline-block",transition:"transform 0.15s",
              transform:openWs[ws.id]?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
            <span style={{fontSize:14,color:"var(--monday-purple)"}}>⬡</span>
            <span style={{fontSize:13,fontWeight:700,color:openWs[ws.id]?"var(--monday-purple)":"var(--gray-700)",flex:1}}>{ws.name}</span>
            <span style={{fontSize:11,color:"var(--gray-300)"}}>{ws.boards.length} boards</span>
          </div>

          {/* Boards */}
          {openWs[ws.id]&&ws.boards.map(board=>(
            <div key={board.id} style={{borderTop:"1px solid var(--gray-100)"}}>

              {/* Board row */}
              <div onClick={()=>toggleBoard(board.id)}
                style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px 8px 32px",
                  cursor:"pointer",background:openBoards[board.id]?"var(--monday-blue-light)":"var(--gray-50)",
                  transition:"background 0.1s"}}
                onMouseEnter={e=>{if(!openBoards[board.id])e.currentTarget.style.background="var(--gray-100)";}}
                onMouseLeave={e=>{e.currentTarget.style.background=openBoards[board.id]?"var(--monday-blue-light)":"var(--gray-50)";}}>
                <span style={{fontSize:11,color:openBoards[board.id]?"var(--monday-blue)":"var(--gray-300)",
                  display:"inline-block",transition:"transform 0.15s",
                  transform:openBoards[board.id]?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                <span style={{fontSize:13,color:"var(--monday-blue)"}}>▦</span>
                <span style={{fontSize:13,fontWeight:500,color:openBoards[board.id]?"var(--monday-blue)":"var(--gray-700)",flex:1}}>{board.name}</span>
                <span style={{fontSize:11,color:"var(--gray-300)"}}>{board.groups.length} groups</span>
              </div>

              {/* Groups */}
              {openBoards[board.id]&&(
                <div style={{background:"white",borderTop:"1px solid var(--gray-100)"}}>
                  {board.groups.length===0
                    ?<div style={{padding:"8px 14px 8px 60px",fontSize:12,color:"var(--gray-300)",fontStyle:"italic"}}>No groups</div>
                    :board.groups.map((group,i)=>(
                      <div key={group.id}
                        style={{display:"flex",alignItems:"center",gap:8,padding:"7px 14px 7px 60px",
                          fontSize:12,color:"var(--gray-500)",
                          borderBottom:i<board.groups.length-1?"1px solid var(--gray-100)":"none"}}>
                        <span style={{width:8,height:8,borderRadius:2,background:"var(--monday-green)",flexShrink:0}}/>
                        {group.name}
                      </div>
                    ))
                  }
                </div>
              )}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ─── Library Panel ────────────────────────────────────────────────────────────
function LibraryPanel({library,onLoad,onDelete,onExportAll,onImport,currentName,onSaveNew,onOverwrite,saving}) {
  const fileRef=useRef();
  const [confirmDel,setConfirmDel]=useState(null);
  const fmt=iso=>new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"});
  const handleFile=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{onImport(JSON.parse(ev.target.result));}catch{alert("Invalid file");}};r.readAsText(f);e.target.value="";};
  const depColor=s=>s==="active"?"var(--monday-green)":s==="deployed"?"var(--monday-blue)":"var(--gray-300)";
  const depLabel=s=>s==="active"?"● Live":s==="deployed"?"● Deployed":"○ Draft";

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--gray-700)"}}>My Automations</div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn-ghost" style={{padding:"6px 10px",fontSize:12}} onClick={()=>fileRef.current?.click()}>↑ Import</button>
          {library.length>0&&<button className="btn-ghost" style={{padding:"6px 10px",fontSize:12}} onClick={onExportAll}>↓ Export</button>}
        </div>
        <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={handleFile}/>
      </div>

      <div style={{padding:"12px 20px",borderBottom:"1px solid var(--gray-100)",display:"flex",gap:8,flexShrink:0}}>
        <button className="btn-primary" style={{flex:1,padding:"8px",opacity:saving?0.5:1}} onClick={onSaveNew} disabled={saving}>
          {saving?"Saving…":"+ Save current"}
        </button>
        {library.some(a=>a.name===currentName)&&(
          <button className="btn-ghost" style={{padding:"8px 12px"}} onClick={onOverwrite} disabled={saving} title="Overwrite existing version">↺ Update</button>
        )}
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"8px 12px"}}>
        {library.length===0&&(
          <div style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:40,marginBottom:12}}>📋</div>
            <div style={{fontSize:15,fontWeight:600,color:"var(--gray-700)",marginBottom:6}}>No automations yet</div>
            <div style={{fontSize:13,color:"var(--gray-300)"}}>Build your first automation on the canvas then click <strong>+ Save current</strong></div>
          </div>
        )}
        {[...library].reverse().map(auto=>(
          <div key={auto.id} style={{background:"white",borderRadius:8,border:"1.5px solid var(--gray-100)",
            padding:"12px 14px",marginBottom:8,transition:"all 0.15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="var(--gray-200)"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="var(--gray-100)"}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,color:"var(--gray-700)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{auto.name}</div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:4}}>
                  <span style={{fontSize:11,color:"var(--gray-300)"}}>{auto.nodeCount} nodes · {fmt(auto.updatedAt)}</span>
                  <span style={{fontSize:11,fontWeight:600,color:depColor(auto.deployStatus)}}>{depLabel(auto.deployStatus)}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button className="btn-ghost" style={{padding:"4px 8px",fontSize:11}} onClick={()=>{const blob=new Blob([JSON.stringify(auto,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=`${auto.name.replace(/\s+/g,"-")}.json`;a.click();URL.revokeObjectURL(u);}}>↓</button>
                {confirmDel===auto.id
                  ?<><button style={{padding:"4px 8px",fontSize:11,background:"var(--monday-red)",color:"white",border:"none",borderRadius:4,cursor:"pointer"}} onClick={()=>{onDelete(auto.id);setConfirmDel(null);}}>Delete</button><button className="btn-ghost" style={{padding:"4px 8px",fontSize:11}} onClick={()=>setConfirmDel(null)}>Cancel</button></>
                  :<button className="btn-ghost" style={{padding:"4px 8px",fontSize:11,color:"var(--monday-red)"}} onClick={()=>setConfirmDel(auto.id)}>Delete</button>}
              </div>
            </div>
            <button className="btn-primary" style={{width:"100%",marginTop:10,padding:"7px",fontSize:13}} onClick={()=>onLoad(auto)}>Load automation</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Deploy Panel ─────────────────────────────────────────────────────────────
function DeployPanel({nodes,edges,automationName,isActive,onDeploySuccess,boards,mondayToken}) {
  const [status,setStatus]=useState(null);
  const [msg,setMsg]=useState("");
  const [deployed,setDeployed]=useState([]);
  const [loading,setLoading]=useState(false);

  const fetchDeployed=async()=>{setLoading(true);try{const d=await listDeployed();setDeployed(d.automations||[]);}catch{}setLoading(false);};
  useEffect(()=>{fetchDeployed();},[]);

  const issues=[];
  nodes.forEach(n=>{
    const c=n.config||{};
    if(n.type==="trigger"&&!c.board) issues.push(`"${n.label}" — no board selected`);
    if(n.type==="trigger"&&n.subtype==="status_change"&&!c.toValue) issues.push(`"${n.label}" — no status value set`);
    if(n.type==="action"&&n.subtype==="create_group"&&!c.board) issues.push(`"${n.label}" — no target board`);
    if(n.type==="action"&&n.subtype==="create_group"&&!c.groupName) issues.push(`"${n.label}" — no group name`);
  });

  const deploy=async(activate)=>{
    setStatus("deploying");setMsg("");
    try{
      const auto={...serializeAuto(automationName,nodes,edges,activate??isActive),
        deployedAt:new Date().toISOString(),deployStatus:activate?"active":"deployed",
        mondayToken};
      await deployToNetlify(auto);
      setStatus("ok");setMsg(`"${automationName}" deployed successfully`);
      onDeploySuccess(auto);await fetchDeployed();
    }catch(e){setStatus("error");setMsg(e.message);}
  };

  const summary=nodes.map(n=>{
    const c=n.config||{};
    const bn=boards.find(b=>b.id===c.board)?.name||"";
    const t=NODE_TYPES[n.type];
    if(n.type==="trigger"&&n.subtype==="status_change") return {icon:t.icon,color:t.color,text:`When status changes to "${c.toValue||"?"}" on ${bn||"?"}`};
    if(n.type==="trigger"&&n.subtype==="item_created") return {icon:t.icon,color:t.color,text:`When item created on ${bn||"?"}`};
    if(n.type==="condition"&&n.subtype==="if_else") return {icon:t.icon,color:t.color,text:`If ${c.column||"?"} ${c.operator||"="} "${c.value||"?"}"`};
    if(n.type==="action"&&n.subtype==="create_group") return {icon:t.icon,color:t.color,text:`Create group "${c.groupName||"?"}" on ${bn||"?"}`};
    if(n.type==="action"&&n.subtype==="create_item") return {icon:t.icon,color:t.color,text:`Create item on ${bn||"?"}`};
    if(n.type==="action"&&n.subtype==="notify") return {icon:t.icon,color:t.color,text:`Notify ${c.who||"assignee"}`};
    if(n.type==="action"&&n.subtype==="change_col") return {icon:t.icon,color:t.color,text:`Set "${c.column||"?"}" to "${c.toValue||"?"}"`};
    if(n.type==="wait") return {icon:t.icon,color:t.color,text:`Wait ${c.amount||1} ${c.unit||"days"}`};
    return {icon:t.icon,color:t.color,text:n.label};
  });

  const fmt=iso=>new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--gray-700)",marginBottom:2}}>Deploy</div>
        <div style={{fontSize:13,color:"var(--gray-300)"}}>Push this automation to your Netlify runner</div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>

        {/* Summary */}
        <div style={{background:"white",borderRadius:10,border:"1px solid var(--gray-100)",overflow:"hidden",marginBottom:16,boxShadow:"var(--shadow-sm)"}}>
          <div style={{padding:"10px 14px",background:"var(--gray-50)",borderBottom:"1px solid var(--gray-100)",fontSize:12,fontWeight:700,color:"var(--gray-500)",textTransform:"uppercase",letterSpacing:0.4}}>Automation flow</div>
          {summary.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:i<summary.length-1?"1px solid var(--gray-100)":"none"}}>
              <span style={{width:26,height:26,background:s.color+"22",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{s.icon}</span>
              <span style={{fontSize:13,color:"var(--gray-700)"}}>{s.text}</span>
            </div>
          ))}
        </div>

        {/* Issues */}
        {issues.length>0&&(
          <div style={{background:"var(--monday-orange-light)",borderRadius:8,padding:"12px 14px",border:"1px solid rgba(255,153,0,0.3)",marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,color:"var(--monday-orange)",marginBottom:6}}>⚠ Fix before deploying</div>
            {issues.map((issue,i)=><div key={i} style={{fontSize:12,color:"var(--gray-700)",marginBottom:3}}>• {issue}</div>)}
          </div>
        )}

        {/* Status */}
        {status&&status!=="deploying"&&(
          <div style={{padding:"12px 14px",background:status==="ok"?"var(--monday-green-light)":"var(--monday-red-light)",borderRadius:8,
            border:`1px solid ${status==="ok"?"rgba(0,200,117,0.3)":"rgba(226,68,92,0.3)"}`,marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:600,color:status==="ok"?"var(--monday-green)":"var(--monday-red)"}}>{status==="ok"?"✓ "+msg:"✗ "+msg}</div>
          </div>
        )}

        {/* Deploy buttons */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          <button className="btn-ghost" style={{flex:1,opacity:status==="deploying"?0.5:1}} onClick={()=>deploy(false)} disabled={status==="deploying"}>
            {status==="deploying"?<><span className="spinning">↻</span> Deploying…</>:"↑ Deploy"}
          </button>
          <button className="btn-success" style={{flex:1,opacity:status==="deploying"?0.5:1}} onClick={()=>deploy(true)} disabled={status==="deploying"}>
            ↑ Deploy + Activate
          </button>
        </div>

        {/* Deployed list */}
        <div style={{fontSize:12,fontWeight:700,color:"var(--gray-500)",textTransform:"uppercase",letterSpacing:0.4,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>Deployed automations</span>
          <button className="btn-ghost" style={{padding:"3px 8px",fontSize:11}} onClick={fetchDeployed}>{loading?"…":"↺ Refresh"}</button>
        </div>
        {deployed.length===0&&!loading&&<div style={{textAlign:"center",padding:"16px",color:"var(--gray-300)",fontSize:13}}>Nothing deployed yet</div>}
        {deployed.map(auto=>(
          <div key={auto.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"white",borderRadius:8,border:"1px solid var(--gray-100)",marginBottom:6}}>
            <div style={{width:8,height:8,borderRadius:4,background:auto.is_active?"var(--monday-green)":"var(--gray-200)",flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:"var(--gray-700)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{auto.name}</div>
              <div style={{fontSize:11,color:"var(--gray-300)"}}>{fmt(auto.updated_at)}</div>
            </div>
            <button className="btn-ghost" style={{padding:"4px 8px",fontSize:11,color:"var(--monday-red)",flexShrink:0}}
              onClick={async()=>{try{await deleteFromNetlify(auto.id);fetchDeployed();}catch{}}}>Remove</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Test Run Panel ───────────────────────────────────────────────────────────
function RunPanel({nodes,edges,boards,mondayToken,anthropicKey,onClose}) {
  const [ctx,setCtx]=useState({itemName:"Project Alpha",itemStatus:"Done",itemOwner:"Alice",itemId:""});
  const [log,setLog]=useState([]);
  const [running,setRunning]=useState(false);

  const run=async()=>{
    if(!mondayToken){alert("Connect your monday.com account in Settings first.");return;}
    setRunning(true);setLog([]);
    const entries=[];
    const addLog=e=>{entries.push(e);setLog([...entries]);};
    const queue=nodes.filter(n=>n.type==="trigger").map(n=>({node:n,ctx:{...ctx}}));
    const visited=new Set();
    while(queue.length){
      const{node,c}=queue.shift();
      if(visited.has(node.id))continue;visited.add(node.id);
      if(node.type==="trigger"){
        addLog({label:node.label,status:"ok",result:`Simulated: "${c.itemName}" / "${c.itemStatus}"`});
        edges.filter(e=>e.from===node.id).forEach(e=>{const next=nodes.find(n=>n.id===e.to);if(next)queue.push({node:next,ctx:{...c}});});
      }else if(node.type==="condition"){
        const cfg=node.config||{};const val=c.itemStatus;
        const match=cfg.operator==="equals"?val===cfg.value:cfg.operator==="not_equals"?val!==cfg.value:cfg.operator==="contains"?(val||"").includes(cfg.value):cfg.operator==="empty"?!val:true;
        addLog({label:node.label,status:"ok",result:`${cfg.column} ${cfg.operator} "${cfg.value}" → ${match?"YES ✓":"NO ✗"}`});
        const port=match?"yes":"no";
        edges.filter(e=>e.from===node.id&&e.fromPort===port).forEach(e=>{const next=nodes.find(n=>n.id===e.to);if(next)queue.push({node:next,ctx:{...c}});});
      }else if(node.type==="action"){
        const t0=Date.now();addLog({label:node.label,status:"running",result:"Calling monday.com API…"});
        try{
          const result=await execActionBrowser(node,c,mondayToken,anthropicKey);
          const ms=Date.now()-t0;
          entries[entries.length-1]={label:node.label,status:result.ok?"ok":"error",result:result.result,ms,simulated:result.simulated};
          setLog([...entries]);
          if(result.aiOutput)c.aiOutput=result.aiOutput;
          edges.filter(e=>e.from===node.id).forEach(e=>{const next=nodes.find(n=>n.id===e.to);if(next)queue.push({node:next,ctx:{...c}});});
        }catch(e){entries[entries.length-1]={label:node.label,status:"error",result:e.message};setLog([...entries]);}
      }else if(node.type==="wait"){
        addLog({label:node.label,status:"skip",result:`Would wait ${node.config?.amount||1} ${node.config?.unit||"days"}`});
        edges.filter(e=>e.from===node.id).forEach(e=>{const next=nodes.find(n=>n.id===e.to);if(next)queue.push({node:next,ctx:{...c}});});
      }
    }
    const ok=entries.filter(l=>l.status==="ok").length,err=entries.filter(l=>l.status==="error").length;
    addLog({label:"Run complete",status:err?"error":"ok",result:`${ok} succeeded · ${err} errors · ${entries.filter(l=>l.status==="skip").length} skipped`});
    setRunning(false);
  };

  const statusColor=s=>s==="ok"?"var(--monday-green)":s==="error"?"var(--monday-red)":s==="skip"?"var(--gray-300)":"var(--monday-blue)";
  const statusIcon=s=>s==="ok"?"✓":s==="error"?"✗":s==="skip"?"○":s==="running"?"↻":"•";

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:"var(--gray-700)"}}>Test Run</div>
          <div style={{fontSize:13,color:"var(--gray-300)"}}>Actions call the real monday.com API</div>
        </div>
        <button className="btn-ghost" style={{padding:"6px 10px"}} onClick={onClose}>✕</button>
      </div>

      <div style={{padding:"14px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--gray-500)",textTransform:"uppercase",letterSpacing:0.4,marginBottom:10}}>Simulated item context</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {[["itemName","Item name"],["itemStatus","Status"],["itemOwner","Owner"],["itemId","Item ID"]].map(([k,l])=>(
            <div key={k}>
              <label className="field-label">{l}</label>
              <input className="field-input" style={{fontSize:13}} value={ctx[k]||""} onChange={e=>setCtx(r=>({...r,[k]:e.target.value}))}/>
            </div>
          ))}
        </div>
        <button className="btn-success" style={{width:"100%",opacity:running?0.5:1}} onClick={run} disabled={running}>
          {running?<><span className="spinning">↻</span> Running…</>:"▶ Run automation"}
        </button>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"10px 20px"}}>
        {log.length===0&&!running&&(
          <div style={{textAlign:"center",padding:"32px 16px",color:"var(--gray-300)"}}>
            <div style={{fontSize:32,marginBottom:8}}>▶</div>
            <div style={{fontSize:13}}>Click "Run automation" to test with real API calls</div>
          </div>
        )}
        {log.map((e,i)=>(
          <div key={i} className="log-entry">
            <span style={{color:statusColor(e.status),fontWeight:700,width:16,flexShrink:0,
              className:e.status==="running"?"spinning":""}}>{statusIcon(e.status)}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:"var(--gray-700)"}}>{e.label}</div>
              {e.result&&<div style={{fontSize:12,color:e.status==="error"?"var(--monday-red)":"var(--gray-500)",marginTop:2}}>{e.result}</div>}
              {e.simulated&&<div style={{fontSize:11,color:"var(--monday-orange)",marginTop:2}}>⚠ Simulated — no API call made</div>}
            </div>
            {e.ms!=null&&<span style={{fontSize:11,color:"var(--gray-300)",flexShrink:0}}>{e.ms}ms</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [nodes,setNodes]=useState(INIT_NODES.map(n=>({...n,config:{...(DEF_CFG[n.subtype]||{}),...(n.config||{})}})));
  const [edges,setEdges]=useState(INIT_EDGES);
  const [selected,setSelected]=useState(null);
  const [pan,setPan]=useState({x:40,y:30});
  const [zoom,setZoom]=useState(0.9);
  const [dragging,setDragging]=useState(null);
  const [connecting,setConnecting]=useState(null);
  const [isPanning,setIsPanning]=useState(false);
  const [panStart,setPanStart]=useState(null);
  const [automationName,setAutomationName]=useState("My Automation");
  const [isActive,setIsActive]=useState(false);
  const [panel,setPanel]=useState("palette"); // palette|settings|library|deploy|run|config
  const [mondayToken,setMondayToken]=useState(()=>localStorage.getItem("mondayToken")||"");
  const [anthropicKey,setAnthropicKey]=useState(()=>localStorage.getItem("anthropicKey")||"");
  const [boards,setBoards]=useState([]);
  const [workspaces,setWorkspaces]=useState([]);
  const [apiConnecting,setApiConnecting]=useState(false);
  const [connectError,setConnectError]=useState("");
  const [library,setLibrary]=useState(()=>loadLibrary());
  const [saving,setSaving]=useState(false);
  const [lastSaved,setLastSaved]=useState(null);
  const [runStatus,setRunStatus]=useState({}); // nodeId → status
  const svgRef=useRef(null);
  const canvasRef=useRef(null);

  useEffect(()=>{ if(mondayToken) localStorage.setItem("mondayToken",mondayToken); },[mondayToken]);
  useEffect(()=>{ if(anthropicKey) localStorage.setItem("anthropicKey",anthropicKey); },[anthropicKey]);
  useEffect(()=>{ if(mondayToken&&boards.length===0) connectMonday(mondayToken); },[]);

  const connectMonday=async(token)=>{
    if(!token){setConnectError("Enter your monday.com API token.");return;}
    setApiConnecting(true);setConnectError("");
    try{ const data=await fetchBoardData(token);setBoards(data.boards||[]);setWorkspaces(data.workspaces||[]);setConnectError(""); }
    catch(e){ setConnectError(e.message.slice(0,120));setBoards([]);setWorkspaces([]); }
    finally{ setApiConnecting(false); }
  };

  const saveNew=async()=>{setSaving(true);const auto=serializeAuto(automationName,nodes,edges,isActive);const next=[...library,auto];setLibrary(next);saveLibrary(next);setLastSaved(JSON.stringify({nodes,edges,name:automationName}));setSaving(false);};
  const overwriteExisting=async()=>{setSaving(true);const auto=serializeAuto(automationName,nodes,edges,isActive);const next=library.map(a=>a.name===automationName?{...auto,id:a.id}:a);setLibrary(next);saveLibrary(next);setLastSaved(JSON.stringify({nodes,edges,name:automationName}));setSaving(false);};
  const deleteAuto=id=>{const next=library.filter(a=>a.id!==id);setLibrary(next);saveLibrary(next);};
  const loadAuto=auto=>{setNodes(auto.nodes);setEdges(auto.edges);setAutomationName(auto.name);setIsActive(auto.isActive||false);setSelected(null);setPanel("palette");setLastSaved(JSON.stringify({nodes:auto.nodes,edges:auto.edges,name:auto.name}));};
  const importAuto=data=>{const items=Array.isArray(data)?data:[data];const stamped=items.map(a=>({...a,id:`auto-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,updatedAt:new Date().toISOString()}));const next=[...library,...stamped];setLibrary(next);saveLibrary(next);if(stamped.length===1)loadAuto(stamped[0]);};
  const exportAll=()=>{const blob=new Blob([JSON.stringify(library,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="monday-automations.json";a.click();URL.revokeObjectURL(u);};
  const onDeploySuccess=deployedAuto=>{const next=library.map(a=>a.name===deployedAuto.name?{...a,deployStatus:deployedAuto.deployStatus,deployedAt:deployedAuto.deployedAt}:a);setLibrary(next);saveLibrary(next);setIsActive(deployedAuto.isActive);};

  const svgPt=useCallback(e=>{
    const r=canvasRef.current.getBoundingClientRect();
    return{x:(e.clientX-r.left-pan.x)/zoom,y:(e.clientY-r.top-pan.y)/zoom};
  },[pan,zoom]);

  const onNodeDown=(e,id)=>{
    e.stopPropagation();
    setSelected(id);
    setPanel("config");
    const pt=svgPt(e),n=nodes.find(n=>n.id===id);
    setDragging({id,ox:pt.x-n.x,oy:pt.y-n.y});
  };
  const onCanvasDown=e=>{
    if(e.target===canvasRef.current||e.target.tagName==="svg"||e.target.classList.contains("canvas-bg")){
      setSelected(null);
      if(panel==="config")setPanel("palette");
      setIsPanning(true);
      setPanStart({x:e.clientX-pan.x,y:e.clientY-pan.y});
    }
  };
  const onMove=e=>{
    if(dragging){const pt=svgPt(e);setNodes(ns=>ns.map(n=>n.id===dragging.id?{...n,x:pt.x-dragging.ox,y:pt.y-dragging.oy}:n));}
    else if(isPanning&&panStart)setPan({x:e.clientX-panStart.x,y:e.clientY-panStart.y});
    else if(connecting){const pt=svgPt(e);setConnecting(c=>({...c,mx:pt.x,my:pt.y}));}
  };
  const onUp=()=>{setDragging(null);setIsPanning(false);if(connecting)setConnecting(null);};
  const onPortDown=(e,nodeId,port)=>{e.stopPropagation();const pt=svgPt(e);setConnecting({fromId:nodeId,fromPort:port,mx:pt.x,my:pt.y});};
  const onInPortUp=(e,nodeId)=>{
    e.stopPropagation();
    if(!connecting||connecting.fromId===nodeId){setConnecting(null);return;}
    if(!edges.some(ed=>ed.from===connecting.fromId&&ed.fromPort===connecting.fromPort&&ed.to===nodeId)){
      setEdges(es=>[...es,{id:`e${Date.now()}`,from:connecting.fromId,fromPort:connecting.fromPort,to:nodeId,toPort:"in",label:connecting.fromPort==="no"?"No":""}]);
    }
    setConnecting(null);
  };
  useEffect(()=>{
    const el=canvasRef.current;
    const h=e=>{e.preventDefault();setZoom(z=>Math.max(0.3,Math.min(2,z*(e.deltaY<0?1.1:0.9))));};
    el?.addEventListener("wheel",h,{passive:false});
    return()=>el?.removeEventListener("wheel",h);
  },[]);
  useEffect(()=>{
    const h=e=>{if((e.key==="Delete"||e.key==="Backspace")&&selected&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){
      setNodes(ns=>ns.filter(n=>n.id!==selected));setEdges(es=>es.filter(e=>e.from!==selected&&e.to!==selected));setSelected(null);setPanel("palette");
    }};
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[selected]);

  const addNode=(type,subtype,label)=>{
    const id=uid();
    setNodes(ns=>[...ns,{id,type,subtype,label,
      x:(300-pan.x)/zoom+Math.random()*40,y:(120-pan.y)/zoom+Math.random()*40,
      outputs:type==="condition"&&subtype==="if_else"?["yes","no"]:["yes"],
      config:{...(DEF_CFG[subtype]||{})}}]);
    setSelected(id);setPanel("config");
  };
  const delNode=id=>{setNodes(ns=>ns.filter(n=>n.id!==id));setEdges(es=>es.filter(e=>e.from!==id&&e.to!==id));if(selected===id){setSelected(null);setPanel("palette");}};
  const delEdge=id=>setEdges(es=>es.filter(e=>e.id!==id));
  const updCfg=(nodeId,cfg)=>setNodes(ns=>ns.map(n=>n.id===nodeId?{...n,config:cfg}:n));

  const selNode=nodes.find(n=>n.id===selected);
  const connected=boards.length>0;
  const isDirty=lastSaved!==JSON.stringify({nodes,edges,name:automationName});
  const deployStatus=library.find(a=>a.name===automationName)?.deployStatus||"draft";

  const sidebarContent=()=>{
    if(panel==="config"&&selNode) return(
      <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
        {/* Config header */}
        <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:28,height:28,background:NODE_TYPES[selNode.type].color+"22",borderRadius:6,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>
                {NODE_TYPES[selNode.type].icon}
              </span>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:NODE_TYPES[selNode.type].color,textTransform:"uppercase",letterSpacing:0.5}}>{NODE_TYPES[selNode.type].label}</div>
                <div style={{fontSize:15,fontWeight:700,color:"var(--gray-700)"}}>{selNode.label}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button style={{background:"var(--monday-red-light)",color:"var(--monday-red)",border:"none",
                padding:"5px 10px",borderRadius:5,cursor:"pointer",fontSize:12,fontWeight:600}}
                onClick={()=>delNode(selNode.id)}>Remove</button>
              <button style={{background:"var(--gray-50)",color:"var(--gray-500)",border:"1px solid var(--gray-200)",
                padding:"5px 8px",borderRadius:5,cursor:"pointer",fontSize:14}}
                onClick={()=>setPanel("palette")}>✕</button>
            </div>
          </div>
        </div>
        {/* Label edit */}
        <div style={{padding:"12px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
          <label className="field-label">Node label</label>
          <input className="field-input" value={selNode.label}
            onChange={e=>setNodes(ns=>ns.map(n=>n.id===selNode.id?{...n,label:e.target.value}:n))}/>
        </div>
        {/* Config form */}
        <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          <ConfigForm node={selNode} onChange={cfg=>updCfg(selNode.id,cfg)} boards={boards} workspaces={workspaces}/>
        </div>
      </div>
    );
    if(panel==="settings") return <SettingsPanel mondayToken={mondayToken} setMondayToken={v=>{setMondayToken(v);localStorage.setItem("mondayToken",v);}} anthropicKey={anthropicKey} setAnthropicKey={v=>{setAnthropicKey(v);localStorage.setItem("anthropicKey",v);}} boards={boards} workspaces={workspaces} onConnect={connectMonday} connecting={apiConnecting} connectError={connectError}/>;
    if(panel==="library") return <LibraryPanel library={library} onLoad={loadAuto} onDelete={deleteAuto} onExportAll={exportAll} onImport={importAuto} currentName={automationName} onSaveNew={saveNew} onOverwrite={overwriteExisting} saving={saving}/>;
    if(panel==="deploy") return <DeployPanel nodes={nodes} edges={edges} automationName={automationName} isActive={isActive} onDeploySuccess={onDeploySuccess} boards={boards} mondayToken={mondayToken}/>;
    if(panel==="run") return <RunPanel nodes={nodes} edges={edges} boards={boards} mondayToken={mondayToken} anthropicKey={anthropicKey} onClose={()=>setPanel("palette")}/>;
    if(panel==="readme") return <ReadMePanel/>;

    // Palette
    return(
      <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid var(--gray-100)",flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:700,color:"var(--gray-700)",marginBottom:2}}>Add nodes</div>
          <div style={{fontSize:13,color:"var(--gray-300)"}}>Drag from here or click to add to canvas</div>
        </div>
        {!connected&&(
          <div style={{margin:"12px 16px",padding:"12px 14px",background:"var(--monday-purple-light)",borderRadius:8,
            border:"1px solid rgba(97,97,255,0.2)",fontSize:13,color:"var(--monday-purple)"}}>
            <strong>Connect monday.com</strong> in Settings to configure boards and columns.
            <button style={{display:"block",marginTop:6,background:"var(--monday-purple)",color:"white",border:"none",
              padding:"6px 12px",borderRadius:5,cursor:"pointer",fontSize:12,fontWeight:600,width:"100%"}}
              onClick={()=>setPanel("settings")}>Open Settings →</button>
          </div>
        )}
        <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
          {Object.entries(TEMPLATES).map(([type,items])=>(
            <div key={type} style={{marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                <span style={{width:6,height:6,borderRadius:3,background:NODE_TYPES[type].color}}/>
                <span style={{fontSize:11,fontWeight:700,color:NODE_TYPES[type].color,textTransform:"uppercase",letterSpacing:0.6}}>{NODE_TYPES[type].label}</span>
              </div>
              {items.map(t=>(
                <button key={t.subtype} className="node-chip" onClick={()=>addNode(type,t.subtype,t.label)}>
                  <span className="node-chip-icon" style={{background:NODE_TYPES[type].color+"15",color:NODE_TYPES[type].color}}>
                    {NODE_TYPES[type].icon}
                  </span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:"var(--gray-700)"}}>{t.label}</div>
                    <div style={{fontSize:11,color:"var(--gray-300)",marginTop:1}}>{t.desc}</div>
                  </div>
                  <span style={{color:"var(--gray-200)",fontSize:16,flexShrink:0}}>+</span>
                </button>
              ))}
            </div>
          ))}
        </div>
      </div>
    );
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"var(--gray-50)",overflow:"hidden"}}>

      {/* ── Top bar ── */}
      <div style={{height:56,background:"white",borderBottom:"1px solid var(--gray-100)",
        display:"flex",alignItems:"center",padding:"0 16px",gap:12,flexShrink:0,
        boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>

        {/* Logo + name */}
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          <div style={{width:32,height:32,background:"linear-gradient(135deg,#6161ff,#a25ddc)",borderRadius:8,
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style={{color:"white",fontSize:16,fontWeight:700}}>⬡</span>
          </div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:10,fontWeight:700,color:"var(--gray-300)",textTransform:"uppercase",letterSpacing:0.5}}>Automation Builder</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input value={automationName} onChange={e=>setAutomationName(e.target.value)}
                style={{border:"none",outline:"none",fontSize:14,fontWeight:700,color:"var(--gray-700)",
                  background:"transparent",minWidth:120,maxWidth:220,padding:0}}/>
              {isDirty&&<span style={{width:6,height:6,borderRadius:3,background:"var(--monday-orange)",flexShrink:0}} title="Unsaved changes"/>}
            </div>
          </div>
        </div>

        {/* Connection status */}
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,
          background:connected?"var(--monday-green-light)":apiConnecting?"var(--monday-blue-light)":"var(--gray-50)",
          border:`1px solid ${connected?"rgba(0,200,117,0.3)":apiConnecting?"rgba(0,115,234,0.3)":"var(--gray-100)"}`,
          fontSize:12,fontWeight:600,
          color:connected?"var(--monday-green)":apiConnecting?"var(--monday-blue)":"var(--gray-300)",
          cursor:"pointer",flexShrink:0}}
          onClick={()=>setPanel("settings")}>
          {apiConnecting&&<span className="spinning">↻</span>}
          {connected&&<span>●</span>}
          {apiConnecting?"Connecting…":connected?`${boards.length} boards loaded`:"Not connected — click to connect"}
        </div>

        <div style={{flex:1}}/>

        {/* Zoom controls */}
        <div style={{display:"flex",alignItems:"center",gap:2,background:"var(--gray-50)",borderRadius:6,
          border:"1px solid var(--gray-100)",padding:"2px"}}>
          <button onClick={()=>setZoom(z=>Math.max(0.3,z*0.87))}
            style={{width:28,height:28,border:"none",background:"transparent",cursor:"pointer",
              borderRadius:4,color:"var(--gray-500)",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
          <span style={{fontSize:12,fontWeight:600,color:"var(--gray-500)",minWidth:38,textAlign:"center"}}>{Math.round(zoom*100)}%</span>
          <button onClick={()=>setZoom(z=>Math.min(2,z*1.15))}
            style={{width:28,height:28,border:"none",background:"transparent",cursor:"pointer",
              borderRadius:4,color:"var(--gray-500)",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
          <button onClick={()=>{setPan({x:40,y:30});setZoom(0.9);}}
            style={{width:28,height:28,border:"none",background:"transparent",cursor:"pointer",
              borderRadius:4,color:"var(--gray-500)",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}
            title="Reset view">↺</button>
        </div>

        {/* Nav buttons */}
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          {[
            {key:"settings",label:"⚙"},
            {key:"library", label:`📋${library.length>0?" "+library.length:""}`},
            {key:"readme",  label:"📖 Read Me"},
          ].map(b=>(
            <button key={b.key} className="btn-ghost"
              style={{padding:"6px 10px",fontSize:13,
                background:panel===b.key?"var(--monday-purple-light)":"transparent",
                color:panel===b.key?"var(--monday-purple)":"var(--gray-500)",
                borderColor:panel===b.key?"rgba(97,97,255,0.3)":"var(--gray-200)"}}
              title={b.key.charAt(0).toUpperCase()+b.key.slice(1)}
              onClick={()=>setPanel(p=>p===b.key?"palette":b.key)}>{b.label}</button>
          ))}
        </div>

        {/* Active toggle */}
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 8px",borderLeft:"1px solid var(--gray-100)"}}>
          <span style={{fontSize:12,fontWeight:600,color:isActive?"var(--monday-green)":"var(--gray-300)"}}>{isActive?"Active":"Draft"}</span>
          <button className="toggle-track" style={{background:isActive?"var(--monday-green)":"var(--gray-200)"}} onClick={()=>setIsActive(a=>!a)}>
            <div className="toggle-thumb" style={{transform:isActive?"translateX(20px)":"translateX(3px)"}}/>
          </button>
        </div>

        {/* Action buttons */}
        <button className="btn-ghost" style={{padding:"7px 14px",fontSize:13}}
          onClick={()=>setPanel(p=>p==="run"?"palette":"run")}>▶ Test</button>

        <button style={{padding:"7px 14px",fontSize:13,fontWeight:600,borderRadius:6,border:"none",cursor:"pointer",
          background:"var(--monday-blue-light)",color:"var(--monday-blue)",transition:"all 0.15s"}}
          onClick={()=>setPanel(p=>p==="deploy"?"palette":"deploy")}>↑ Deploy</button>

        <button className="btn-primary" style={{padding:"7px 16px",opacity:saving?0.6:1}} onClick={saveNew} disabled={saving}>
          {saving?"Saving…":"Save"}
        </button>
      </div>

      {/* ── Body ── */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* Sidebar */}
        <div style={{width:300,background:"white",borderRight:"1px solid var(--gray-100)",
          display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden",
          boxShadow:"2px 0 8px rgba(0,0,0,0.04)"}}>
          {sidebarContent()}
        </div>

        {/* Canvas */}
        <div ref={canvasRef} className="canvas-bg"
          style={{flex:1,position:"relative",overflow:"hidden",cursor:isPanning?"grabbing":"default"}}
          onMouseDown={onCanvasDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}>

          {/* SVG for edges */}
          <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none",overflow:"visible"}}>
            <defs>
              <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M2 2L8 5L2 8" fill="none" stroke="#6161ff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </marker>
              <marker id="ah-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M2 2L8 5L2 8" fill="none" stroke="#e2445c" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </marker>
              <marker id="ah-live" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M2 2L8 5L2 8" fill="none" stroke="#6161ff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.5"/>
              </marker>
            </defs>
            <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`} style={{pointerEvents:"all"}}>
              {edges.map(edge=>{
                const fn=nodes.find(n=>n.id===edge.from), tn=nodes.find(n=>n.id===edge.to);
                if(!fn||!tn)return null;
                const fp=portPos(fn,edge.fromPort), tp=portPos(tn,"in");
                const isNo=edge.fromPort==="no";
                const color=isNo?"#e2445c":"#6161ff";
                const d=ePath(fp,tp), mx=(fp.x+tp.x)/2, my=(fp.y+tp.y)/2;
                return(
                  <g key={edge.id}>
                    <path d={d} fill="none" stroke="transparent" strokeWidth={16} onClick={()=>delEdge(edge.id)} style={{cursor:"pointer"}}/>
                    <path d={d} fill="none" stroke={color} strokeWidth={2} strokeDasharray={isNo?"6 4":"none"}
                      markerEnd={`url(#ah${isNo?"-no":""})`} opacity={0.7}/>
                    {edge.label&&(
                      <g>
                        <rect x={mx-18} y={my-10} width={36} height={20} rx={10}
                          fill={color} opacity={0.9}/>
                        <text x={mx} y={my+4} textAnchor="middle" fill="white" fontSize={10} fontWeight={700} fontFamily="Figtree,sans-serif">{edge.label}</text>
                      </g>
                    )}
                  </g>
                );
              })}
              {connecting&&(()=>{
                const fn=nodes.find(n=>n.id===connecting.fromId);
                if(!fn)return null;
                const fp=portPos(fn,connecting.fromPort);
                return<path d={ePath(fp,{x:connecting.mx,y:connecting.my})} fill="none" stroke="#6161ff" strokeWidth={2} strokeDasharray="6 4" opacity={0.4} markerEnd="url(#ah-live)"/>;
              })()}
            </g>
          </svg>

          {/* Nodes (HTML, positioned absolutely) */}
          <div style={{position:"absolute",transformOrigin:"0 0",transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`}}>
            {nodes.map(node=>(
              <NodeCard key={node.id} node={node} selected={node.id===selected}
                boards={boards} onMouseDown={onNodeDown}
                onPortDown={onPortDown} onInPortUp={onInPortUp}
                runStatus={runStatus[node.id]}/>
            ))}
          </div>

          {/* Empty state */}
          {nodes.length===0&&(
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:48,marginBottom:12}}>⬡</div>
                <div style={{fontSize:18,fontWeight:700,color:"var(--gray-700)",marginBottom:6}}>Start building your automation</div>
                <div style={{fontSize:14,color:"var(--gray-300)"}}>Add nodes from the sidebar to get started</div>
              </div>
            </div>
          )}

          {/* Canvas hint */}
          <div style={{position:"absolute",bottom:12,right:16,fontSize:11,color:"var(--gray-300)",
            background:"white",padding:"5px 10px",borderRadius:20,border:"1px solid var(--gray-100)",
            boxShadow:"var(--shadow-sm)"}}>
            Scroll to zoom · Drag canvas to pan · Click edge to delete
          </div>

          {/* Nodes count */}
          <div style={{position:"absolute",bottom:12,left:16,fontSize:11,color:"var(--gray-300)",
            background:"white",padding:"5px 10px",borderRadius:20,border:"1px solid var(--gray-100)",
            boxShadow:"var(--shadow-sm)"}}>
            {nodes.length} nodes · {edges.length} connections
            {deployStatus!=="draft"&&<span style={{marginLeft:8,color:deployStatus==="active"?"var(--monday-green)":"var(--monday-blue)",fontWeight:600}}>● {deployStatus==="active"?"Live":"Deployed"}</span>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
