<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Automate — monday.com Automation Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --white: #ffffff;
    --gray-50: #f6f7fb;
    --gray-100: #ecedf2;
    --gray-200: #d0d4e4;
    --gray-300: #b0b6c9;
    --gray-500: #676879;
    --gray-700: #323338;
    --gray-900: #1c1f3b;
    --monday-purple: #6161ff;
    --monday-purple-dark: #4b4bdc;
    --monday-purple-light: #ebebff;
    --monday-green: #00c875;
    --monday-green-light: #e6faf3;
    --monday-red: #e2445c;
    --monday-red-light: #fdedf0;
    --monday-orange: #ff9900;
    --monday-orange-light: #fff4e0;
    --monday-blue: #0073ea;
    --monday-blue-light: #e6f2ff;
    --monday-teal: #00d3d0;
    --monday-teal-light: #e0fafa;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.16);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--gray-50);
    color: var(--gray-700);
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
  }
  input, select, textarea, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray-300); }

  /* Canvas dot pattern */
  .canvas-bg { background-color: var(--gray-50); background-image: radial-gradient(circle, #c8cbda 1px, transparent 1px); background-size: 24px 24px; }

  /* Node styles */
  .node-card {
    position: absolute;
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 2px solid var(--gray-100);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s, border-color 0.15s;
    min-width: 220px;
  }
  .node-card:hover { box-shadow: var(--shadow-md); }
  .node-card.selected { border-color: var(--monday-purple); box-shadow: 0 0 0 3px rgba(97,97,255,0.15), var(--shadow-md); }
  .node-card.running { border-color: var(--monday-green); box-shadow: 0 0 0 3px rgba(0,200,117,0.15); }
  .node-card.error { border-color: var(--monday-red); box-shadow: 0 0 0 3px rgba(226,68,92,0.15); }

  /* Port dots */
  .port {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--gray-300);
    cursor: crosshair;
    transition: border-color 0.15s, transform 0.15s;
    z-index: 10;
  }
  .port:hover { border-color: var(--monday-purple); transform: scale(1.3); }
  .port.in { left: -7px; top: 50%; transform: translateY(-50%); }
  .port.in:hover { transform: translateY(-50%) scale(1.3); }
  .port.out { right: -7px; top: 50%; transform: translateY(-50%); }
  .port.out:hover { transform: translateY(-50%) scale(1.3); }
  .port.out-yes { right: -7px; top: calc(50% - 10px); transform: translateY(-50%); }
  .port.out-yes:hover { transform: translateY(-50%) scale(1.3); }
  .port.out-no  { right: -7px; top: calc(50% + 10px); transform: translateY(-50%); }
  .port.out-no:hover  { transform: translateY(-50%) scale(1.3); }
  .port.connected { background: var(--monday-purple); border-color: var(--monday-purple); }

  /* Sidebar chip buttons */
  .node-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-md);
    border: 1.5px solid var(--gray-100);
    background: white; cursor: pointer;
    transition: all 0.15s; text-align: left; width: 100%;
    margin-bottom: 6px;
  }
  .node-chip:hover { border-color: var(--monday-purple); background: var(--monday-purple-light); box-shadow: var(--shadow-sm); }
  .node-chip-icon {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  /* Form fields */
  .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-500); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field-input {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--gray-200); background: white;
    font-size: 14px; color: var(--gray-700); transition: border-color 0.15s;
    outline: none;
  }
  .field-input:focus { border-color: var(--monday-purple); box-shadow: 0 0 0 3px rgba(97,97,255,0.1); }
  .field-input::placeholder { color: var(--gray-300); }
  .field-row { margin-bottom: 14px; }

  /* Buttons */
  .btn-primary {
    background: var(--monday-purple); color: white; border: none;
    padding: 9px 18px; border-radius: var(--radius-sm); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover { background: var(--monday-purple-dark); box-shadow: var(--shadow-sm); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-success {
    background: var(--monday-green); color: white; border: none;
    padding: 9px 18px; border-radius: var(--radius-sm); font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-success:hover { filter: brightness(0.92); }
  .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--gray-500); border: 1.5px solid var(--gray-200);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--gray-300); background: var(--gray-50); color: var(--gray-700); }
  .btn-danger {
    background: transparent; color: var(--monday-red); border: 1.5px solid rgba(226,68,92,0.3);
    padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%;
  }
  .btn-danger:hover { background: var(--monday-red-light); border-color: var(--monday-red); }

  /* Token pills */
  .token-pill {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 500; background: var(--monday-purple-light);
    color: var(--monday-purple); border: 1px solid rgba(97,97,255,0.2);
    cursor: pointer; margin: 0 4px 4px 0; transition: all 0.15s;
  }
  .token-pill:hover { background: var(--monday-purple); color: white; }

  /* Tag / badge */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }

  /* Section divider */
  .divider { height: 1px; background: var(--gray-100); margin: 16px 0; }

  /* Tooltip-style hint */
  .hint { font-size: 12px; color: var(--gray-300); margin-top: 5px; line-height: 1.5; }

  /* Workspace tree */
  .ws-header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s;
    font-weight: 600; font-size: 13px; color: var(--gray-700);
  }
  .ws-header:hover { background: var(--gray-50); }
  .board-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px 6px 32px; border-radius: var(--radius-sm);
    font-size: 13px; color: var(--gray-500); cursor: pointer; transition: all 0.1s;
  }
  .board-row:hover { background: var(--gray-50); color: var(--gray-700); }

  /* Animate */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .spinning { animation: spin 1s linear infinite; display:inline-block; }
  .pulsing { animation: pulse 1.5s ease-in-out infinite; }

  /* Toggle switch */
  .toggle-track {
    width: 44px; height: 24px; border-radius: 12px; cursor: pointer;
    position: relative; transition: background 0.2s; flex-shrink: 0;
    border: none; outline: none;
  }
  .toggle-thumb {
    position: absolute; top: 3px; width: 18px; height: 18px;
    border-radius: 9px; background: white; transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  /* Log entry */
  .log-entry {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--gray-100); font-size: 13px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

// ─── Design tokens ────────────────────────────────────────────────────────────
const NODE_TYPES = {
  trigger:   { color:"#6161ff", light:"#ebebff", label:"Trigger",   icon:"⚡" },
  condition: { color:"#00c875", light:"#e6faf3", label:"Condition", icon:"◆" },
  action:    { color:"#ff9900", light:"#fff4e0", label:"Action",    icon:"▶" },
  wait:      { color:"#0073ea", light:"#e6f2ff", label:"Wait",      icon:"◷" },
  loop:      { color:"#e2445c", light:"#fdedf0", label:"Loop",      icon:"↺" },
  formula:   { color:"#00d3d0", light:"#e0fafa", label:"Formula",   icon:"∑" },
};

const PROXY = "/api/monday";
const ANTHROPIC_API = "https://api.anthropic.com/v1/messages";

// ─── Storage ──────────────────────────────────────────────────────────────────
const loadLibrary = () => { try { return JSON.parse(localStorage.getItem("automations-v3")||"[]"); } catch { return []; } };
const saveLibrary = lib => { try { localStorage.setItem("automations-v3", JSON.stringify(lib)); } catch {} };
const serializeAuto = (name, nodes, edges, isActive) => ({
  id: `auto-${Date.now()}`, name, isActive, updatedAt: new Date().toISOString(),
  nodeCount: nodes.length, edgeCount: edges.length, nodes, edges, deployStatus: "draft"
});

// ─── monday GraphQL proxy ─────────────────────────────────────────────────────
async function mondayGQL(token, query, variables={}) {
  const res = await fetch(PROXY, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token,query,variables}) });
  if(!res.ok) throw new Error(`Proxy ${res.status}`);
  const json = await res.json();
  if(json.errors?.length) throw new Error(json.errors[0].message);
  return json.data;
}

async function fetchBoardData(token) {
  const wsData = await mondayGQL(token, `{ workspaces { id name } }`);
  const workspaces = wsData.workspaces || [];
  let allBoards = [], page = 1;
  while(true) {
    const data = await mondayGQL(token, `{ boards(limit:50,page:${page}) { id name workspace{id name} groups{id title} columns{id title type settings_str} } }`);
    const batch = data.boards || [];
    allBoards = allBoards.concat(batch);
    if(batch.length < 50 || page >= 10) break;
    page++;
  }
  const boards = allBoards.map(b => ({
    id:b.id, name:b.name,
    workspaceId: b.workspace?.id || "main",
    workspaceName: b.workspace?.name || "Main Workspace",
    groups: (b.groups||[]).map(g=>({id:g.id,name:g.title})),
    columns: (b.columns||[]).map(col => {
      let values=[];
      try{ const s=JSON.parse(col.settings_str||"{}"); if(s.labels) values=Object.values(s.labels).filter(Boolean); }catch{}
      return {id:col.id, name:col.title, type:col.type, values};
    }),
  }));
  const wsMap={};
  boards.forEach(b=>{ const k=b.workspaceId; if(!wsMap[k]) wsMap[k]={id:k,name:b.workspaceName,boards:[]}; wsMap[k].boards.push(b); });
  return { boards, workspaces: Object.values(wsMap) };
}

// ─── Netlify deploy API ───────────────────────────────────────────────────────
const netlifyReq = (method,path,body) => fetch(`/api${path}`,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(async r=>{if(!r.ok){const t=await r.text();throw new Error(`${r.status}: ${t.slice(0,100)}`);}return r.json();});
const deployToNetlify   = auto => netlifyReq("PUT",    `/automations/${auto.id}`, auto);
const deleteFromNetlify = id   => netlifyReq("DELETE", `/automations/${id}`);
const listDeployed      = ()   => netlifyReq("GET",    "/automations");

// ─── Token resolution ─────────────────────────────────────────────────────────
const resolveTokens = (str, ctx={}) => (str||"")
  .replace(/\{\{item\.name\}\}/g,   ctx.itemName  ||"Sample Item")
  .replace(/\{\{item\.status\}\}/g, ctx.itemStatus||"Done")
  .replace(/\{\{item\.owner\}\}/g,  ctx.itemOwner ||"User")
  .replace(/\{\{item\.id\}\}/g,     ctx.itemId    ||"")
  .replace(/\{\{today\}\}/g,        new Date().toISOString().slice(0,10))
  .replace(/\{\{ai\.output\}\}/g,   ctx.aiOutput  ||"")
  .replace(/\{\{loop\.index\}\}/g,  String(ctx.loopIndex||1));

// ─── Browser action execution ─────────────────────────────────────────────────
async function execActionBrowser(node, ctx, token, anthropicKey) {
  const c=node.config||{};
  switch(node.subtype){
    case"create_group":{
      const name=resolveTokens(c.groupName||"New Group",ctx);
      if(c.groupMode==="template"&&c.templateGroupId){
        // Duplicate template group then rename
        const dupData=await mondayGQL(token,`mutation($b:ID!,$g:String!,$n:Boolean!){duplicate_group(board_id:$b,group_id:$g,add_to_top:$n){id title}}`,{b:c.board,g:c.templateGroupId,n:true});
        const newGroupId=dupData.duplicate_group.id;
        await mondayGQL(token,`mutation($b:ID!,$g:String!,$n:String!){update_group(board_id:$b,group_id:$g,group_attribute:title,new_value:$n){id title}}`,{b:c.board,g:newGroupId,n:name});
        return{ok:true,result:`Created group "${name}" from template`};
      }
      const data=await mondayGQL(token,`mutation($b:ID!,$n:String!){create_group(board_id:$b,group_name:$n){id title}}`,{b:c.board,n:name});
      return{ok:true,result:`Created group "${data.create_group.title}"`};
    }
    case"create_item":{const name=resolveTokens(c.itemName||"New Item",ctx);const vars={b:parseInt(c.board),n:name,cv:"{}"};if(c.group)vars.g=c.group;const data=await mondayGQL(token,`mutation($b:Int!,$n:String!,$g:String,$cv:JSON!){create_item(board_id:$b,item_name:$n,group_id:$g,column_values:$cv){id name}}`,vars);return{ok:true,result:`Created item "${data.create_item.name}"`};}
    case"change_col":{if(!ctx.itemId)return{ok:false,result:"No item ID in test context"};await mondayGQL(token,`mutation($b:Int!,$i:Int!,$c:String!,$v:JSON!){change_column_value(board_id:$b,item_id:$i,column_id:$c,value:$v){id}}`,{b:parseInt(c.board),i:parseInt(ctx.itemId),c:c.column,v:JSON.stringify({label:c.toValue})});return{ok:true,result:`Set "${c.column}" → "${c.toValue}"`};}
    case"move_item":{if(!ctx.itemId)return{ok:false,result:"No item ID in test context"};await mondayGQL(token,`mutation($i:Int!,$g:String!){move_item_to_group(item_id:$i,group_id:$g){id}}`,{i:parseInt(ctx.itemId),g:c.group});return{ok:true,result:`Moved to group "${c.group}"`};}
    case"http_request":{const url=resolveTokens(c.url||"",ctx);if(!url)return{ok:false,result:"No URL configured"};try{const res=await fetch(url,{method:c.method||"POST",headers:{"Content-Type":"application/json"},body:resolveTokens(c.body||"{}",ctx)});return{ok:res.ok,result:`${c.method} → ${res.status}`};}catch(e){return{ok:false,result:e.message};}}
    case"ai_step":{if(!anthropicKey)return{ok:false,result:"No Anthropic key in Settings"};const prompt=resolveTokens(c.prompt||"",ctx);const res=await fetch(ANTHROPIC_API,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":anthropicKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:prompt}]})});const data=await res.json();const output=data.content?.[0]?.text||"";return{ok:true,result:output.slice(0,200),aiOutput:output};}
    case"notify":return{ok:true,result:`Notify ${c.who||"assignee"}: "${resolveTokens(c.message||"",ctx).slice(0,60)}"`,simulated:true};
    case"formula_math":
    case"formula_pct":
    case"formula_if":
    case"formula_concat":
      return{ok:false,result:"Formula nodes require the Netlify runner to read live column values. Deploy and activate to run.",simulated:true};
    default:return{ok:false,result:`No executor for "${node.subtype}"`};
  }
}

// ─── Node templates ───────────────────────────────────────────────────────────
const TEMPLATES = {
  trigger:[
    {subtype:"status_change", label:"Status changes",      desc:"When a status column changes to a value"},
    {subtype:"item_created",  label:"Item created",         desc:"When a new item is added to a board"},
    {subtype:"date_reached",  label:"Date reached",         desc:"When a date column value arrives"},
    {subtype:"column_changed",label:"Column value changes", desc:"When any column is updated"},
  ],
  condition:[
    {subtype:"if_else",label:"If / Else",    desc:"Branch your automation based on a value"},
    {subtype:"filter", label:"Filter / Gate",desc:"Only continue if a condition is true"},
  ],
  action:[
    {subtype:"notify",      label:"Notify user",       desc:"Send a notification to someone"},
    {subtype:"change_col",  label:"Change column",     desc:"Set a column to a specific value"},
    {subtype:"create_item", label:"Create item",       desc:"Add a new item to any board"},
    {subtype:"create_group",label:"Create group",      desc:"Add a new group to any board"},
    {subtype:"move_item",   label:"Move item",         desc:"Move an item to another group"},
    {subtype:"http_request",label:"HTTP request",      desc:"Call a webhook or external API"},
  ],
  formula:[
    {subtype:"formula_math",  label:"Math formula",   desc:"Add, subtract, multiply, divide columns"},
    {subtype:"formula_pct",   label:"Percentage",     desc:"Calculate a percentage between two values"},
    {subtype:"formula_if",    label:"IF condition",   desc:"If A > B write X, otherwise write Y"},
    {subtype:"formula_concat",label:"Combine text",   desc:"Join column values into one text field"},
  ],
  wait:[
    {subtype:"wait_time", label:"Wait",           desc:"Pause for a set amount of time"},
    {subtype:"wait_event",label:"Wait for event", desc:"Pause until a condition is met"},
  ],
};

const DEF_CFG={
  status_change:{board:"",column:"",toValue:""},item_created:{board:""},
  date_reached:{board:"",column:"",offset:"0"},column_changed:{board:"",column:""},
  if_else:{board:"",column:"",operator:"equals",value:"",compareMode:"fixed",compareColumn:""},filter:{board:"",column:"",operator:"equals",value:"",compareMode:"fixed",compareColumn:""},
  notify:{who:"assignee",message:""},change_col:{board:"",column:"",toValue:""},
  create_item:{board:"",group:"",itemName:"{{item.name}}"},create_group:{board:"",groupName:"{{item.name}} — Project",groupMode:"blank",templateGroupId:""},
  move_item:{board:"",group:""},http_request:{method:"POST",url:"",body:'{"item":"{{item.name}}"}'},
  ai_step:{prompt:"Summarize {{item.name}} and suggest next steps."},
  wait_time:{amount:"1",unit:"business days"},wait_event:{board:"",column:"",operator:"equals",value:""},
  formula_math:  {board:"",colA:"",operator:"+",colB:"",resultCol:"",resultBoard:""},
  formula_pct:   {board:"",colA:"",colB:"",resultCol:"",resultBoard:""},
  formula_if:    {board:"",colA:"",operator:">",colB:"",trueVal:"",falseVal:"",resultCol:"",resultBoard:""},
  formula_concat:{board:"",cols:[],separator:" ",resultCol:"",resultBoard:""},
};

const NW=240, NH=80, PR=7;
let _uid=400; const uid=()=>`n${++_uid}`;

const INIT_NODES=[
  {id:"n1",type:"trigger",  subtype:"status_change", label:"Status changes to Done",       x:60, y:200,outputs:["yes"],config:{board:"",column:"",toValue:"Done"}},
  {id:"n2",type:"condition",subtype:"if_else",        label:"Is priority High?",            x:360,y:200,outputs:["yes","no"],config:{board:"",column:"",operator:"equals",value:"High"}},
  {id:"n3",type:"action",   subtype:"create_group",   label:"Create group on target board", x:660,y:110,outputs:["yes"],config:{board:"",groupName:"Completed — {{item.name}}"}},
  {id:"n4",type:"action",   subtype:"notify",         label:"Notify owner",                 x:660,y:330,outputs:["yes"],config:{who:"assignee",message:"{{item.name}} is done."}},
];
const INIT_EDGES=[
  {id:"e1",from:"n1",fromPort:"yes",to:"n2",toPort:"in",label:""},
  {id:"e2",from:"n2",fromPort:"yes",to:"n3",toPort:"in",label:"Yes"},
  {id:"e3",from:"n2",fromPort:"no", to:"n4",toPort:"in",label:"No"},
];

function portPos(node, port) {
  const mx = node.x + NW, my = node.y + NH/2;
  if(port==="in")    return {x:node.x, y:my};
  if(port==="yes")   return {x:mx, y:node.outputs?.length>1 ? my-12 : my};
  if(port==="no")    return {x:mx, y:my+12};
  return {x:mx, y:my};
}

function ePath(f,t) {
  const dx=t.x-f.x, cx=Math.max(80, Math.abs(dx)*0.5);
  return `M${f.x} ${f.y} C${f.x+cx} ${f.y} ${t.x-cx} ${t.y} ${t.x} ${t.y}`;
}

function nodeSummary(node, boards) {
  const c=node.config||{}, bn=boards.find(b=>b.id===c.board)?.name||"";
  switch(node.subtype){
    case"status_change": return c.toValue?`${bn} → "${c.toValue}"`:bn||"Select a board";
    case"item_created":  return bn||"Select a board";
    case"if_else":       return c.column?(c.compareMode==="column"?`${c.column} ${c.operator} ${c.compareColumn||"?"}`:c.value?`${c.column} ${c.operator} "${c.value}"`:c.column):"Configure condition";
    case"notify":        return c.who==="assignee"?"Notify item assignee":"Notify "+c.who;
    case"change_col":    return c.toValue?`Set ${c.column} → "${c.toValue}"`:c.column||"Configure column";
    case"create_item":   return bn?`Create item on ${bn}`:bn||"Select a board";
    case"create_group":  return c.groupName?resolveTokens(c.groupName,{itemName:"Item Name"}).slice(0,28):bn||"Select a board";
    case"move_item":     return c.group?`Move to ${c.group}`:"Select a group";
    case"http_request":  return c.url?(c.method||"POST")+" "+c.url.replace(/https?:\/\//,"").slice(0,22):"Enter a URL";
    case"ai_step":       return c.prompt?c.prompt.slice(0,28)+"…":"Enter a prompt";
    case"wait_time":     return `Wait ${c.amount||1} ${c.unit||"business days"}`;
    case"formula_math":  return c.colA&&c.colB?`${c.colA} ${c.operator||"+"} ${c.colB} → ${c.resultCol||"?"}`:c.board||"Configure formula";
    case"formula_pct":   return c.colA&&c.colB?`${c.colA} ÷ ${c.colB} × 100 → ${c.resultCol||"?"}`:c.board||"Configure formula";
    case"formula_if":    return c.colA?`IF ${c.colA} ${c.operator||">"} ${c.colB||"?"} → ${c.resultCol||"?"}`:c.board||"Configure formula";
    case"formula_concat":return c.resultCol?`Combine → ${c.resultCol}`:c.board||"Configure formula";
    default: return "";
  }
}

// ─── Workspace board picker ────────────────────────────────────────────────────
function BoardPicker({value, onChange, boards, workspaces, label="Board"}) {
  const [open,setOpen]=useState(false);
  const [search,setSearch]=useState("");
  const [openWs,setOpenWs]=useState({});
  const ref=useRef(null);
  const selected=boards.find(b=>b.id===value);

  // When a board is already selected, auto-open its workspace
  useEffect(()=>{
    if(value&&selected){
      setOpenWs(o=>({...o,[selected.workspaceId||"main"]:true}));
    }
  },[value]);

  useEffect(()=>{
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setSearch("");} };
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);

  const toggleWs=(id,e)=>{ e.stopPropagation(); setOpenWs(o=>({...o,[id]:!o[id]})); };

  // When searching, show all boards flat; when not, show workspace tree
  const isSearching=search.length>0;
  const filtered=boards.filter(b=>b.name.toLowerCase().includes(search.toLowerCase()));

  // Build workspace groups from all boards (not just filtered, for the tree)
  const wsGroups={};
  boards.forEach(b=>{
    const k=b.workspaceId||"main";
    const wn=b.workspaceName||"Main Workspace";
    if(!wsGroups[k])wsGroups[k]={id:k,name:wn,boards:[]};
    wsGroups[k].boards.push(b);
  });

  return(
    <div className="field-row" ref={ref} style={{position:"relative"}}>
      <label className="field-label">{label}</label>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        style={{width:"100%",padding:"8px 12px",borderRadius:6,border:`1.5px solid ${open?"var(--monday-purple)":"var(--gray-200)"}`,
          background:"white",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",
          justifyContent:"space-between",fontSize:14,color:selected?"var(--gray-700)":"var(--gray-300)",transition:"all 0.15s"}}>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {selected
            ?<><span style={{color:"var(--gray-300)",fontSize:12}}>{selected.workspaceName} / </span>{selected.name}</>
            :"Select a board…"}
        </span>
        <span style={{color:"var(--gray-300)",marginLeft:8,flexShrink:0}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:1000,
          background:"white",borderRadius:8,border:"1.5px solid var(--gray-200)",
          boxShadow:"var(--shadow-lg)",maxHeight:320,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {/* Search */}
          <div style={{padding:"8px 8px 4px",borderBottom:"1px solid var(--gray-100)"}}>
            <input autoFocus className="field-input" placeholder="Search boards…" value={search}
              onChange={e=>setSearch(e.target.value)} onClick={e=>e.stopPropagation()} style={{fontSize:13}}/>
          </div>
          <div style={{overflowY:"auto",flex:1}}>
            {isSearching
              /* Flat search results */
              ?filtered.length===0
                ?<div style={{padding:16,textAlign:"center",color:"var(--gray-300)",fontSize:13}}>No boards match</div>
                :filtered.map(b=>(
                  <div key={b.id} onClick={()=>{onChange(b.id);setOpen(false);setSearch("");}}
                    style={{padding:"9px 12px",fontSize:13,cursor:"pointer",
                      background:b.id===value?"var(--monday-purple-light)":"white",
                      color:b.id===value?"var(--monday-purple)":"var(--gray-700)",
                      fontWeight:b.id===value?600:400,
                      borderBottom:"1px solid var(--gray-100)",display:"flex",alignItems:"center",gap:8}}
                    onMouseEnter={e=>{ if(b.id!==value)e.currentTarget.style.background="var(--gray-50)"; }}
                    onMouseLeave={e=>{ e.currentTarget.style.background=b.id===value?"var(--monday-purple-light)":"white"; }}>
                    <span style={{fontSize:11,color:"var(--gray-300)"}}>{b.workspaceName} /</span>
                    {b.id===value&&<span style={{color:"var(--monday-purple)"}}>✓</span>}
                    {b.name}
                  </div>
                ))
              /* Workspace tree (all collapsed by default) */
              :Object.values(wsGroups).map(ws=>(
                <div key={ws.id} style={{borderBottom:"1px solid var(--gray-100)"}}>
                  {/* Workspace header - clickable to expand */}
                  <div onClick={e=>toggleWs(ws.id,e)}
                    style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",cursor:"pointer",
                      background:openWs[ws.id]?"var(--monday-purple-light)":"var(--gray-50)",
                      borderBottom:openWs[ws.id]?"1px solid var(--gray-100)":"none"}}
                    onMouseEnter={e=>{ if(!openWs[ws.id])e.currentTarget.style.background="var(--gray-100)"; }}
                    onMouseLeave={e=>{ e.currentTarget.style.background=openWs[ws.id]?"var(--monday-purple-light)":"var(--gray-50)"; }}>
                    <span style={{fontSize:10,color:openWs[ws.id]?"var(--monday-purple)":"var(--gray-300)",
                      display:"inline-block",transition:"transform 0.15s",
                      transform:openWs[ws.id]?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                    <span style={{fontSize:13,color:"var(--monday-purple)"}}>⬡</span>
                    <span style={{fontSize:13,fontWeight:700,color:openWs[ws.id]?"var(--monday-purple)":"var(--gray-700)",flex:1}}>{ws.name}</span>
                    <span style={{fontSize:11,color:"var(--gray-300)",background:"var(--gray-100)",
                      padding:"1px 6px",borderRadius:10}}>{ws.boards.length}</span>
                  </div>
                  {/* Boards inside workspace */}
                  {openWs[ws.id]&&ws.boards.map(b=>(
                    <div key={b.id} onClick={()=>{onChange(b.id);setOpen(false);setSearch("");}}
                      style={{padding:"9px 12px 9px 28px",fontSize:13,cursor:"pointer",
                        background:b.id===value?"var(--monday-purple-light)":"white",
                        color:b.id===value?"var(--monday-purple)":"var(--gray-700)",
                        fontWeight:b.id===value?600:400,
                        borderBottom:"1px solid var(--gray-100)",display:"flex",alignItems:"center",gap:8}}
                      onMouseEnter={e=>{ if(b.id!==value)e.currentTarget.style.background="var(--gray-50)"; }}
                      onMouseLeave={e=>{ e.currentTarget.style.background=b.id===value?"var(--monday-purple-light)":"white"; }}>
                      {b.id===value&&<span style={{color:"var(--monday-purple)"}}>✓</span>}
                      {b.name}
                    </div>
                  ))}
                </div>
              ))
            }
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Standalone field components (defined outside ConfigForm to prevent focus loss) ──
function CfgColSel({cols,value,onChange,label="Column",flt}) {
  const list=flt?cols.filter(flt):cols;
  return(
    <div className="field-row">
      <label className="field-label">{label}</label>
      <select className="field-input" value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">Select a column…</option>
        {list.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
      </select>
    </div>
  );
}
function CfgVSel({col,value,onChange,label="Value",fk}) {
  if(col?.type==="color"||col?.type==="status") return(
    <div className="field-row">
      <label className="field-label">{label}</label>
      <select className="field-input" value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">Any value</option>
        {(col.values||[]).map(v=><option key={v} value={v}>{v}</option>)}
      </select>
    </div>
  );
  return(
    <div className="field-row">
      <label className="field-label">{label}</label>
      <input className="field-input" value={value||""} onChange={e=>onChange(e.target.value)} placeholder="Enter value…"/>
    </div>
  );
}
function CfgGSel({groups,value,onChange,label="Group"}) {
  return(
    <div className="field-row">
      <label className="field-label">{label}</label>
      <select className="field-input" value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">Select a group…</option>
        {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
      </select>
    </div>
  );
}
function CfgOSel({value,onChange}) {
  return(
    <div className="field-row">
      <label className="field-label">Operator</label>
      <select className="field-input" value={value||"equals"} onChange={e=>onChange(e.target.value)}>
        <optgroup label="Equality">
          <option value="equals">equals</option>
          <option value="not_equals">does not equal</option>
        </optgroup>
        <optgroup label="Comparison (numbers)">
          <option value="greater_than">greater than</option>
          <option value="greater_than_or_equal">greater than or equal to</option>
          <option value="less_than">less than</option>
          <option value="less_than_or_equal">less than or equal to</option>
          <option value="between">between (use two values below)</option>
        </optgroup>
        <optgroup label="Text">
          <option value="contains">contains</option>
          <option value="not_contains">does not contain</option>
          <option value="starts_with">starts with</option>
        </optgroup>
        <optgroup label="Presence">
          <option value="empty">is empty</option>
          <option value="not_empty">is not empty</option>
        </optgroup>
      </select>
    </div>
  );
}
function CfgTokens({tokens,current,onInsert}) {
  return(
    <div style={{marginBottom:12}}>
      <label className="field-label">Insert token</label>
      <div>{tokens.map(tok=><span key={tok} className="token-pill" onClick={()=>onInsert((current||"")+" "+tok)}>{tok}</span>)}</div>
    </div>
  );
}
function CfgBP({boards,workspaces,value,onChange,label="Board"}) {
  if(boards.length===0) return(
    <div className="field-row"><div style={{padding:"10px 12px",background:"var(--gray-50)",borderRadius:6,fontSize:13,color:"var(--gray-300)"}}>Connect monday.com in Settings to load boards</div></div>
  );
  return <BoardPicker value={value||""} onChange={onChange} boards={boards} workspaces={workspaces} label={label}/>;
}

// ─── Config form ──────────────────────────────────────────────────────────────
function ConfigForm({node,onChange,boards,workspaces}) {
  const c=node.config||{};
  const set=(k,v)=>onChange({...c,[k]:v});
  const board=boards.find(b=>b.id===c.board);
  const cols=board?.columns||[];
  const col=cols.find(x=>x.id===c.column);
  const groups=board?.groups||[];

  if(boards.length===0) return(
    <div style={{textAlign:"center",padding:"24px 16px"}}>
      <div style={{fontSize:32,marginBottom:8}}>🔌</div>
      <div style={{fontSize:14,fontWeight:600,color:"var(--gray-700)",marginBottom:4}}>Not connected</div>
      <div style={{fontSize:13,color:"var(--gray-300)"}}>Go to Settings and connect your monday.com account to configure this node.</div>
    </div>
  );

  switch(node.subtype){
    case"status_change":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Watch board"/><CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Status column" flt={x=>x.type==="color"||x.type==="status"}/>{col&&<CfgVSel col={col} value={c.toValue||""} onChange={v=>set("toValue",v)} label="Changes to"/>}<p className="hint">Fires whenever this status changes to the selected value on any item.</p></>;
    case"item_created":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Watch board"/><p className="hint">Fires when any new item is created on this board.</p></>;
    case"date_reached":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Watch board"/><CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Date column" flt={x=>x.type==="date"}/><div className="field-row"><label className="field-label">Offset (days before/after)</label><input className="field-input" type="number" value={c.offset||"0"} onChange={e=>set("offset",e.target.value)}/><p className="hint">0 = on the date. Negative = before, positive = after.</p></div></>;
    case"column_changed":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Watch board"/><CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Column"/><p className="hint">Fires whenever this column changes to any value.</p></>;
    case"if_else":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Check board"/>
      <CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Column to check"/>
      <CfgOSel value={c.operator||"equals"} onChange={v=>set("operator",v)}/>
      {c.operator!=="empty"&&c.operator!=="not_empty"&&(<>
        {/* Compare mode toggle */}
        <div className="field-row">
          <label className="field-label">Compare against</label>
          <div style={{display:"flex",gap:6}}>
            {[["fixed","A fixed value"],["column","Another column"]].map(([mode,label])=>(
              <button key={mode} type="button"
                style={{flex:1,padding:"7px 10px",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",
                  border:`1.5px solid ${(c.compareMode||"fixed")===mode?"var(--monday-purple)":"var(--gray-200)"}`,
                  background:(c.compareMode||"fixed")===mode?"var(--monday-purple-light)":"white",
                  color:(c.compareMode||"fixed")===mode?"var(--monday-purple)":"var(--gray-500)"}}
                onClick={()=>set("compareMode",mode)}>{label}</button>
            ))}
          </div>
        </div>
        {/* Fixed value */}
        {(c.compareMode||"fixed")==="fixed"&&c.operator!=="between"&&(
          <CfgVSel col={col} value={c.value||""} onChange={v=>set("value",v)} label="Value"/>
        )}
        {/* Between needs two fixed values */}
        {(c.compareMode||"fixed")==="fixed"&&c.operator==="between"&&(<>
          <CfgVSel col={col} value={c.value||""} onChange={v=>set("value",v)} label="From value"/>
          <div className="field-row">
            <label className="field-label">To value</label>
            <input className="field-input" type="number" value={c.valueTo||""} onChange={e=>set("valueTo",e.target.value)} placeholder="Upper bound…"/>
          </div>
        </>)}
        {/* Column comparison */}
        {c.compareMode==="column"&&(
          <div className="field-row">
            <label className="field-label">Compare to column</label>
            <select className="field-input" value={c.compareColumn||""} onChange={e=>set("compareColumn",e.target.value)}>
              <option value="">Select a column…</option>
              {cols.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
            <p className="hint">The condition reads the live value of both columns at runtime and compares them. Works with formula, number, and text columns.</p>
          </div>
        )}
        {/* Live preview */}
        {c.column&&c.operator&&(c.compareMode==="column"?c.compareColumn:c.value)&&(
          <div style={{padding:"8px 12px",background:"var(--gray-50)",borderRadius:6,fontSize:12,color:"var(--gray-500)",marginBottom:10}}>
            If <strong style={{color:"var(--gray-700)"}}>{cols.find(x=>x.id===c.column)?.name||c.column}</strong> {c.operator.replace(/_/g," ")} {c.compareMode==="column"?<strong style={{color:"var(--gray-700)"}}>{cols.find(x=>x.id===c.compareColumn)?.name||c.compareColumn}</strong>:<strong style={{color:"var(--gray-700)"}}>{c.value}</strong>}
          </div>
        )}
      </>)}
      <div style={{padding:"10px 12px",background:"var(--monday-purple-light)",borderRadius:6,fontSize:13,marginBottom:12}}>
        <strong style={{color:"var(--monday-purple)"}}>Yes</strong> path fires if true — <strong style={{color:"var(--monday-red)"}}>No</strong> path fires if false.
      </div>
    </>;
    case"filter":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Check board"/>
      <CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Column to check"/>
      <CfgOSel value={c.operator||"equals"} onChange={v=>set("operator",v)}/>
      {c.operator!=="empty"&&c.operator!=="not_empty"&&(<>
        <div className="field-row">
          <label className="field-label">Compare against</label>
          <div style={{display:"flex",gap:6}}>
            {[["fixed","A fixed value"],["column","Another column"]].map(([mode,label])=>(
              <button key={mode} type="button"
                style={{flex:1,padding:"7px 10px",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",
                  border:`1.5px solid ${(c.compareMode||"fixed")===mode?"var(--monday-purple)":"var(--gray-200)"}`,
                  background:(c.compareMode||"fixed")===mode?"var(--monday-purple-light)":"white",
                  color:(c.compareMode||"fixed")===mode?"var(--monday-purple)":"var(--gray-500)"}}
                onClick={()=>set("compareMode",mode)}>{label}</button>
            ))}
          </div>
        </div>
        {(c.compareMode||"fixed")==="fixed"&&c.operator!=="between"&&(
          <CfgVSel col={col} value={c.value||""} onChange={v=>set("value",v)} label="Value"/>
        )}
        {(c.compareMode||"fixed")==="fixed"&&c.operator==="between"&&(<>
          <CfgVSel col={col} value={c.value||""} onChange={v=>set("value",v)} label="From value"/>
          <div className="field-row">
            <label className="field-label">To value</label>
            <input className="field-input" type="number" value={c.valueTo||""} onChange={e=>set("valueTo",e.target.value)} placeholder="Upper bound…"/>
          </div>
        </>)}
        {c.compareMode==="column"&&(
          <div className="field-row">
            <label className="field-label">Compare to column</label>
            <select className="field-input" value={c.compareColumn||""} onChange={e=>set("compareColumn",e.target.value)}>
              <option value="">Select a column…</option>
              {cols.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
            <p className="hint">Reads the live value of both columns at runtime. Works with formula, number, and text columns.</p>
          </div>
        )}
      </>)}
      <p className="hint">Execution stops here if the condition is false.</p>
    </>;
    case"notify":return<>
      <div className="field-row"><label className="field-label">Notify who</label>
        <select className="field-input" value={c.who||"assignee"} onChange={e=>set("who",e.target.value)}>
          <option value="assignee">Item assignee</option><option value="owner">Board owner(s)</option>
        </select>
      </div>
      <div className="field-row"><label className="field-label">Message</label><textarea className="field-input" style={{height:80,resize:"vertical"}} value={c.message||""} onChange={e=>set("message",e.target.value)} placeholder="e.g. {{item.name}} has been completed!"/></div>
      <CfgTokens tokens={["{{item.name}}","{{item.status}}","{{today}}"]} current={c.message} onInsert={v=>set("message",v)}/>
    </>;
    case"change_col":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Target board"/><CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Column to update"/>{col?.type==="color"||col?.type==="status"?<CfgVSel col={col} value={c.toValue||""} onChange={v=>set("toValue",v)} label="Set value to"/>:<div className="field-row"><label className="field-label">Set to</label><input className="field-input" value={c.toValue||""} onChange={e=>set("toValue",e.target.value)} placeholder="Value or {{token}}…"/></div>}</>;
    case"create_item":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Create item on board"/>{c.board&&<CfgGSel groups={groups} value={c.group||""} onChange={v=>set("group",v)} label="In group"/>}<div className="field-row"><label className="field-label">Item name</label><input className="field-input" value={c.itemName||""} onChange={e=>set("itemName",e.target.value)} placeholder="{{item.name}} — copy"/></div><CfgTokens tokens={["{{item.name}}","{{item.status}}","{{today}}"]} current={c.itemName} onInsert={v=>set("itemName",v)}/></>;
    case"create_group":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Create group on board"/>
      {c.board&&<>
        {/* Mode toggle — blank group or duplicate template */}
        <div className="field-row">
          <label className="field-label">Group type</label>
          <div style={{display:"flex",gap:6}}>
            {[["blank","New blank group"],["template","Duplicate a template group"]].map(([mode,label])=>(
              <button key={mode} type="button"
                style={{flex:1,padding:"7px 10px",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",
                  border:`1.5px solid ${(c.groupMode||"blank")===mode?"var(--monday-purple)":"var(--gray-200)"}`,
                  background:(c.groupMode||"blank")===mode?"var(--monday-purple-light)":"white",
                  color:(c.groupMode||"blank")===mode?"var(--monday-purple)":"var(--gray-500)"}}
                onClick={()=>set("groupMode",mode)}>{label}</button>
            ))}
          </div>
        </div>

        {/* Template group picker */}
        {c.groupMode==="template"&&<>
          <div className="field-row">
            <label className="field-label">Template group</label>
            <select className="field-input" value={c.templateGroupId||""} onChange={e=>set("templateGroupId",e.target.value)}>
              <option value="">Select template group…</option>
              {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
            <p className="hint">This group will be duplicated — all its items, columns, and structure copy over automatically. The original template stays untouched.</p>
          </div>
        </>}

        {/* Group name — used for both modes */}
        <div className="field-row">
          <label className="field-label">{c.groupMode==="template"?"Name the new group":"Group name"}</label>
          <input className="field-input" value={c.groupName||""} onChange={e=>set("groupName",e.target.value)}
            placeholder={c.groupMode==="template"?"{{item.name}} — Project":"Completed — {{item.name}}"}/>
        </div>
        <CfgTokens tokens={["{{item.name}}","{{item.status}}","{{today}}"]} current={c.groupName} onInsert={v=>set("groupName",v)}/>
        {c.groupName&&(
          <div className="field-row">
            <label className="field-label">Preview</label>
            <div style={{padding:"8px 12px",background:"var(--gray-50)",borderRadius:6,fontSize:13,color:"var(--monday-purple)",fontWeight:500}}>
              {resolveTokens(c.groupName,{itemName:"Acme Corp"})}
              {c.groupMode==="template"&&c.templateGroupId&&(
                <span style={{fontSize:11,color:"var(--gray-300)",marginLeft:8}}>
                  (copy of "{groups.find(g=>g.id===c.templateGroupId)?.name||"template"}")
                </span>
              )}
            </div>
          </div>
        )}
      </>}
    </>;
    case"move_item":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Target board"/>{c.board&&<CfgGSel groups={groups} value={c.group||""} onChange={v=>set("group",v)} label="Move item to group"/>}<p className="hint">Moves the item that triggered this automation.</p></>;
    case"http_request":return<>
      <div className="field-row" style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <div style={{width:90}}>
          <label className="field-label">Method</label>
          <select className="field-input" value={c.method||"POST"} onChange={e=>set("method",e.target.value)}>
            {["GET","POST","PUT","PATCH","DELETE"].map(m=><option key={m}>{m}</option>)}
          </select>
        </div>
        <div style={{flex:1}}>
          <label className="field-label">URL</label>
          <input className="field-input" value={c.url||""} onChange={e=>set("url",e.target.value)} placeholder="https://hooks.example.com/…"/>
        </div>
      </div>
      <div className="field-row"><label className="field-label">Body (JSON)</label><textarea className="field-input" style={{height:90,resize:"vertical",fontFamily:"monospace",fontSize:12}} value={c.body||""} onChange={e=>set("body",e.target.value)}/></div>
      <CfgTokens tokens={["{{item.name}}","{{item.status}}","{{item.id}}"]} current={c.body} onInsert={v=>set("body",v)}/>
    </>;
    case"ai_step":return<>
      <div className="field-row"><label className="field-label">Claude prompt</label><textarea className="field-input" style={{height:90,resize:"vertical"}} value={c.prompt||""} onChange={e=>set("prompt",e.target.value)} placeholder="Summarize {{item.name}} and suggest next steps."/><p className="hint">{"{{ai.output}}"} is available in downstream nodes. Requires an Anthropic API key in Settings.</p></div>
      <CfgTokens tokens={["{{item.name}}","{{item.status}}","{{item.owner}}"]} current={c.prompt} onInsert={v=>set("prompt",v)}/>
    </>;
    case"wait_time":return<>
      <div className="field-row" style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <div style={{width:100}}><label className="field-label">Amount</label><input className="field-input" type="number" min="1" value={c.amount||"1"} onChange={e=>set("amount",e.target.value)}/></div>
        <div style={{flex:1}}><label className="field-label">Unit</label><select className="field-input" value={c.unit||"business days"} onChange={e=>set("unit",e.target.value)}>{["minutes","hours","business days","weeks"].map(u=><option key={u}>{u}</option>)}</select></div>
      </div>
      <p className="hint">Pauses automation for <strong>{c.amount||1} {c.unit||"business days"}</strong> before continuing. Requires Cloudflare Worker for long waits.</p>
    </>;
    case"wait_event":return<><CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Watch board"/><CfgColSel cols={cols} value={c.column||""} onChange={v=>set("column",v)} label="Column"/><CfgOSel value={c.operator||"equals"} onChange={v=>set("operator",v)}/>{c.operator==="equals"&&<CfgVSel col={col} value={c.value||""} onChange={v=>set("value",v)} label="Value"/>}<p className="hint">Pauses until the condition becomes true (checked every 5 minutes).</p></>;

    case"formula_math":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Source board"/>
      {c.board&&<>
        <div className="field-row">
          <label className="field-label">Formula</label>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <select className="field-input" style={{flex:1}} value={c.colA||""} onChange={e=>set("colA",e.target.value)}>
              <option value="">Column A…</option>
              {cols.filter(x=>x.type==="numbers"||x.type==="numeric").map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
            <select className="field-input" style={{width:60}} value={c.operator||"+"} onChange={e=>set("operator",e.target.value)}>
              {["+","−","×","÷"].map(op=><option key={op} value={op}>{op}</option>)}
            </select>
            <select className="field-input" style={{flex:1}} value={c.colB||""} onChange={e=>set("colB",e.target.value)}>
              <option value="">Column B…</option>
              {cols.filter(x=>x.type==="numbers"||x.type==="numeric").map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
          </div>
          <p className="hint">Both columns must be number type. Result = Column A {c.operator||"+"} Column B.</p>
        </div>
        <CfgColSel cols={cols} value={c.resultCol||""} onChange={v=>set("resultCol",v)} label="Write result to column" flt={x=>x.type==="numbers"||x.type==="numeric"}/>
        {c.colA&&c.colB&&c.resultCol&&<div style={{padding:"10px 12px",background:"var(--monday-teal-light)",borderRadius:6,fontSize:13,color:"var(--monday-teal)",fontWeight:500}}>
          ∑ {cols.find(x=>x.id===c.colA)?.name||"A"} {c.operator||"+"} {cols.find(x=>x.id===c.colB)?.name||"B"} → {cols.find(x=>x.id===c.resultCol)?.name||"Result"}
        </div>}
      </>}
    </>;

    case"formula_pct":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Source board"/>
      {c.board&&<>
        <div className="field-row">
          <label className="field-label">Numerator (part)</label>
          <select className="field-input" value={c.colA||""} onChange={e=>set("colA",e.target.value)}>
            <option value="">Select column…</option>
            {cols.filter(x=>x.type==="numbers"||x.type==="numeric").map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
          </select>
        </div>
        <div className="field-row">
          <label className="field-label">Denominator (total)</label>
          <select className="field-input" value={c.colB||""} onChange={e=>set("colB",e.target.value)}>
            <option value="">Select column…</option>
            {cols.filter(x=>x.type==="numbers"||x.type==="numeric").map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
          </select>
        </div>
        <CfgColSel cols={cols} value={c.resultCol||""} onChange={v=>set("resultCol",v)} label="Write result % to column" flt={x=>x.type==="numbers"||x.type==="numeric"}/>
        <p className="hint">Result = (Column A ÷ Column B) × 100. For example: 25 ÷ 100 = 25%.</p>
      </>}
    </>;

    case"formula_if":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Source board"/>
      {c.board&&<>
        <div className="field-row">
          <label className="field-label">Condition</label>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <select className="field-input" style={{flex:1}} value={c.colA||""} onChange={e=>set("colA",e.target.value)}>
              <option value="">Column A…</option>
              {cols.filter(x=>x.type==="numbers"||x.type==="numeric").map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
            </select>
            <select className="field-input" style={{width:60}} value={c.operator||">"} onChange={e=>set("operator",e.target.value)}>
              {[">","<","=",">=","<=","!="].map(op=><option key={op} value={op}>{op}</option>)}
            </select>
            <input className="field-input" style={{width:80}} type="number" value={c.colB||""} onChange={e=>set("colB",e.target.value)} placeholder="Value"/>
          </div>
        </div>
        <div className="field-row">
          <label className="field-label">If true, write</label>
          <input className="field-input" value={c.trueVal||""} onChange={e=>set("trueVal",e.target.value)} placeholder="e.g. On Track"/>
        </div>
        <div className="field-row">
          <label className="field-label">If false, write</label>
          <input className="field-input" value={c.falseVal||""} onChange={e=>set("falseVal",e.target.value)} placeholder="e.g. Behind"/>
        </div>
        <CfgColSel cols={cols} value={c.resultCol||""} onChange={v=>set("resultCol",v)} label="Write result to column"/>
      </>}
    </>;

    case"formula_concat":return<>
      <CfgBP boards={boards} workspaces={workspaces} value={c.board||""} onChange={v=>set("board",v)} label="Source board"/>
      {c.board&&<>
        <div className="field-row">
          <label className="field-label">Columns to combine (in order)</label>
          {(c.cols||[]).map((colId,i)=>(
            <div key={i} style={{display:"flex",gap:6,marginBottom:6}}>
              <select className="field-input" value={colId||""} onChange={e=>{const arr=[...(c.cols||[])];arr[i]=e.target.value;set("cols",arr);}}>
                <option value="">Select column…</option>
                {cols.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
              </select>
              <button style={{background:"var(--monday-red-light)",color:"var(--monday-red)",border:"none",borderRadius:5,padding:"0 10px",cursor:"pointer",fontWeight:700,flexShrink:0}}
                onClick={()=>{const arr=[...(c.cols||[])];arr.splice(i,1);set("cols",arr);}}>x</button>
            </div>
          ))}
          <button className="btn-ghost" style={{width:"100%",fontSize:12,marginTop:2}}
            onClick={()=>set("cols",[...(c.cols||[]),""])}>+ Add column</button>
        </div>
        <div className="field-row">
          <label className="field-label">Separator between values</label>
          <input className="field-input" value={c.separator!=null?c.separator:" "} onChange={e=>set("separator",e.target.value)} placeholder="space, comma, dash…"/>
        </div>
        <CfgColSel cols={cols} value={c.resultCol||""} onChange={v=>set("resultCol",v)} label="Write combined text to column"/>
      </>}
    </>;

    default:return<p style={{color:"var(--gray-300)",fontSize:13}}>No configuration needed for this node.</p>;
  }
}

// ─── Node card on canvas ──────────────────────────────────────────────────────
function NodeCard({node,selected,boards,onMouseDown,onPortDown,onInPortUp,runStatus}) {
  const t=NODE_TYPES[node.type];
  const tmpl=TEMPLATES[node.type]?.find(x=>x.subtype===node.subtype);
  const summary=nodeSummary(node,boards);
  const hasConfig=node.config?.board||(node.type==="action"&&node.subtype==="notify");

  return(
    <div
      className={`node-card${selected?" selected":""}${runStatus==="running"?" running":""}${runStatus==="error"?" error":""}`}
      style={{left:node.x,top:node.y,width:NW}}
      onMouseDown={e=>onMouseDown(e,node.id)}>

      {/* Header stripe */}
      <div style={{background:t.color,borderRadius:"10px 10px 0 0",padding:"10px 14px",
        display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>{t.icon}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.7)",textTransform:"uppercase",letterSpacing:0.6}}>{t.label}</div>
          <div style={{fontSize:13,fontWeight:700,color:"white",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{node.label}</div>
        </div>
        {runStatus==="running"&&<span className="spinning" style={{color:"white",fontSize:14}}>↻</span>}
        {runStatus==="ok"&&<span style={{color:"white",fontSize:14}}>✓</span>}
        {runStatus==="error"&&<span style={{color:"white",fontSize:14}}>✗</span>}
      </div>

      {/* Body */}
      <div style={{padding:"10px 14px",borderRadius:"0 0 10px 10px"}}>
        <div style={{fontSize:12,color:summary&&hasConfig?"var(--gray-700)":"var(--gray-300)",
          fontWeight:hasConfig?500:400,lineHeight:1.4,minHeight:18}}>
          {summary||<span style={{fontStyle:"italic"}}>Click to configure</span>}
        </div>
        {hasConfig&&<div style={{width:8,height:8,borderRadius:4,background:"var(--monday-green)",marginTop:6,display:"inline-block"}}/>}
      </div>

      {/* In port */}
      {node.type!=="trigger"&&(
        <div className={`port in${node.type!=="trigger"?" connected":""}`}
          style={{borderColor:t.color}}
          onMouseUp={e=>onInPortUp(e,node.id)}/>
      )}

      {/* Out ports */}
      {node.outputs?.map((port,i)=>{
        const isNo=port==="no";
        const cls=node.outputs.length>1?(port==="yes"?"port out-yes":"port out-no"):"port out";
        return(
          <div key={port} className={cls} style={{borderColor:isNo?"var(--monday-red)":t.color}}
            onMouseDown={e=>onPortDown(e,node.id,port)}>
          </div>
        );
      })}

      {/* Port labels for if/else */}
      {node.outputs?.length>1&&(
        <>
          <div style={{position:"absolute",right:-28,top:"calc(50% - 24px)",fontSize:10,fontWeight:700,color:"var(--monday-purple)"}}>Y</div>
          <div style={{position:"absolute",right:-26,top:"calc(50% + 8px)",fontSize:10,fontWeight:700,color:"var(--monday-red)"}}>N</div>
        </>
      )}
    </div>
  );
}

// ─── Settings Panel ───────────────────────────────────────────────────────────
function SettingsPanel({mondayToken,setMondayToken,anthropicKey,setAnthropicKey,boards,workspaces,onConnect,connecting,connectError}) {
  const [mt,setMt]=useState(mondayToken);

  return(
    <div style={{padding:"20px",overflowY:"auto",flex:1}}>

        <div style={{fontSize:13,color:"var(--gray-300)"}}>Connect your monday.com account to get started.</div>
      </div>

      <div style={{background:"white",borderRadius:10,border:"1px solid var(--gray-100)",padding:"16px",marginBottom:16,boxShadow:"var(--shadow-sm)"}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--gray-700)",marginBottom:14,display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:28,height:28,background:"var(--monday-purple-light)",borderRadius:6,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:14}}>⬡</span>
          monday.com
        </div>
        <div className="field-row">
          <label className="field-label">API Token</label>
          <input type="password" className="field-input" value={mt} onChange={e=>setMt(e.target.value)} placeholder="eyJhbGciOiJ…"/>
          <p className="hint">Find it in monday.com → Profile → Developers → API v2 Token</p>
        </div>
        <button className="btn-primary" style={{width:"100%",marginTop:4,opacity:connecting?0.6:1}}
          onClick={()=>{setMondayToken(mt);setAnthropicKey(ak);onConnect(mt);}} disabled={connecting}>
          {connecting?<><span className="spinning">↻</span> Connecting…</>:boards.length>0?"✓ Reconnect":"Connect to monday.com"}
        </button>
        {connectError&&<div style={{marginTop:10,padding:"8px 12px",background:"var(--monday-red-light)",borderRadius:6,fontSize:13,color:"var(--monday-red)"}}>{connectError}</div>}
      </div>

      {boards.length>0&&(
        <WorkspaceTree workspaces={workspaces}/>
      )}
    </div>
  );
}

// ─── Read Me Panel ────────────────────────────────────────────────────────────
function ReadMePanel() {
  const [section,setSection]=useState("overview");
  const sections=[
    {key:"overview",  label:"Overview"},
    {key:"triggers",  label:"Triggers"},
    {key:"conditions",label:"Conditions"},
    {key:"actions",   label:"Actions"},
    {key:"formulas",  label:"Formulas"},
    {key:"tokens",    label:"Tokens"},
    {key:"deploy",    label:"Deploying"},
    {key:"examples",  label:"Examples"},
  ];
  const H=({children})=><div style={{fontSize:15,fontWeight:700,color:"var(--gray-700)",marginBottom:8,marginTop:16}}>{children}</div>;
  const P=({children})=><div style={{fontSize:13,color:"var(--gray-500)",lineHeight:1.7,marginBottom:10}}>{children}</div>;
  const Code=({children})=><code style={{background:"var(--gray-50)",border:"1px solid var(--gray-100)",borderRadius:4,padding:"1px 6px",fontSize:12,color:"var(--monday-purple)",fontFamily:"monospace"}}>{children}</code>;

  const Step=({n,children})=>(
